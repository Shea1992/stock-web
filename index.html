  function downloadText(name, text){
    try{
      var blob = new Blob([text], { type:'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
      return true;
    }catch(e){
      console.warn('下载失败', e);
      return false;
    }
  }

  function downloadProxySource(){
    var el = document.getElementById('proxySource');
    var txt = el ? el.textContent : '';
    if (!txt.trim()){ showToast('代理脚本内容缺失'); return; }
    if (downloadText('feed_proxy.py', txt.trim() + '\n')){
      showToast('已下载 feed_proxy.py，运行后可切换为代理模式');
    } else {
      showToast('当前浏览器不支持文件下载');
    }
  }

  function bootstrapSync(){
    var f = feedConfig();
    if (!state.recs.length) return;
    // 只有存在「推荐日之后仍未补齐」的交易日才需要跑，全齐就跳过
    var missing = state.recs.some(function(r){ return planRec(r).need; });
    var stale = !f.lastSyncAt || (Date.now() - f.lastSyncAt) > 15 * 60000;
    if (!missing && !stale) return;
    syncAll({ reason:'init', silent:true });
  }

  function bindSettings(){
    var f = feedConfig();
    var urlEl = els.settings.querySelector('#feedUrl');
    if (urlEl){
      urlEl.addEventListener('change', function(e){
        f.proxyUrl = e.target.value.trim();
        save();
      });
    }
    var srcEl = els.settings.querySelector('#feedSource');
    if (srcEl){
      srcEl.addEventListener('change', function(e){
        f.proxySource = e.target.value === 'tushare' ? 'tushare' : 'akshare';
        save();
      });
    }
    var tokEl = els.settings.querySelector('#feedToken');
    if (tokEl){
      tokEl.addEventListener('change', function(e){
        f.token = e.target.value.trim();
        save();
      });
    }
    var autoEl = els.settings.querySelector('#autoSyncToggle');
    if (autoEl){
      autoEl.addEventListener('change', function(e){
        f.autoSync = e.target.checked;
        save();
        renderCurrent();
      });
    }
    var nt = els.settings.querySelector('#notifyToggle');
    if (nt){
      nt.addEventListener('change', function(e){
        var want = e.target.checked;
        if (!want){ state.settings.notify = false; save(); return; }
        if (typeof Notification === 'undefined'){
          e.target.checked = false;
          state.settings.notify = false;
          save();
          return;
        }
        if (Notification.permission === 'granted'){
          state.settings.notify = true; save(); return;
        }
        if (Notification.permission === 'denied'){
          e.target.checked = false;
          state.settings.notify = false;
          save();
          alert('浏览器已拒绝通知权限，请在地址栏的站点设置里重新允许。');
          return;
        }
        Notification.requestPermission().then(function(p){
          state.settings.notify = (p === 'granted');
          if (p !== 'granted'){ e.target.checked = false; }
          save();
          renderCurrent();
        }).catch(function(){
          state.settings.notify = false;
          e.target.checked = false;
          save();
        });
      });
    }
    var list = els.settings.querySelector('#schedList');
    if (list){
      list.addEventListener('change', function(e){
        var t = e.target;
        if (t.dataset.schedTime){
          var item = state.settings.schedules.find(function(x){ return x.id === t.dataset.schedTime; });
          if (item && /^\d{2}:\d{2}$/.test(t.value)){ item.time = t.value; item.lastRunKey = null; save(); }
        } else if (t.dataset.schedToggle){
          var it = state.settings.schedules.find(function(x){ return x.id === t.dataset.schedToggle; });
          if (it){ it.enabled = t.checked; if (!it.enabled) it.lastRunKey = null; save(); renderCurrent(); }
        } else if (t.dataset.schedLabel){
          var it2 = state.settings.schedules.find(function(x){ return x.id === t.dataset.schedLabel; });
          if (it2){ it2.label = t.value.trim() || '价格检查'; save(); }
        }
      });
    }
  }

  function showToast(msg){
    var el = document.querySelector('.toast');

      el = document.createElement('div');

      el.setAttribute('role', 'status');
      document.body.appendChild(el);

    el.textContent = msg;

  function openHoldForm(code, origin){
    var rec = state.recs.find(function(r){ return r.code === code; });
    if (!rec){ showToast('该标的已不在跟踪列表'); return; }
    var h = holdOf(rec);
    ui.holdBack = typeof origin === 'string' ? origin : '';
    ui.holdSaving = false;
    openSheet('<div class="sheet-head"><div><h2 id="sheetTitle">' + (h ? '修改我的买入价' : '记录我的买入价') + '</h2>'
      + '<p class="rec-sub">' + esc(rec.name) + ' ' + esc(rec.code) + ' · 推荐区间 ' + fmtPrice(rec.buyLow) + '–' + fmtPrice(rec.buyHigh) + '</p></div>' + closeIcon() + '</div>'
      + holdFormHtml(rec));
    var form = els.sheetContent.querySelector('#holdForm');
    if (!form) return;
    // 双通道提交：保存按钮点击 + 表单 submit（回车）都能触发，且不会重复写入
    form.addEventListener('submit', function(e){ e.preventDefault(); submitHold(code); });
    form.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT'){ e.preventDefault(); submitHold(code); }
    });
    Array.prototype.forEach.call(form.querySelectorAll('input'), function(inp){
      inp.addEventListener('input', function(){
        var wrap = inp.closest('.field');
        if (wrap) wrap.classList.remove('is-bad');

        if (inp.id === 'h-date') holdSetErr('hdate', '');
      });
      inp.addEventListener('focus', function(){
        setTimeout(function(){
          try { inp.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){ try{ inp.scrollIntoView(); }catch(e2){} }
        }, 260);
      });
    });
    // 首次录入不主动弹键盘，避免键盘挡住底部保存栏；修改时聚焦便于直接改价
    if (h){ var priceEl = form.querySelector('#h-price'); if (priceEl) setTimeout(function(){ priceEl.focus({ preventScroll:true }); }, 90); }
  }

  function holdSetErr(name, msg){

  // 兼容中文输入法/粘贴：全角数字、中文句号、逗号小数点、¥ 符号
  function parsePriceInput(raw){
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return NaN;
    s = s.replace(/[\uFF01-\uFF5E]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
    s = s.replace(/[。．]/g, '.').replace(/[，,]/g, '.').replace(/[¥￥元\s]/g, '');
    if (!/^\d{1,7}(\.\d{1,4})?$/.test(s)) return NaN;
    return Number(s);
  }
  function normDayKey(v){
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    s = s.replace(/[\uFF01-\uFF5E]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); });
    s = s.replace(/年|月/g, '-').replace(/日/g, '').replace(/[\/.]/g, '-');
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) s = m[1] + '-' + pad(Number(m[2])) + '-' + pad(Number(m[3]));
    else { m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) s = m[1] + '-' + m[2] + '-' + m[3]; }
    return isDayKey(s) ? s : '';
  }
  // 校验失败必须看得见：红框 + 抖动 + 滚到出错字段 + 浮层提示
  function holdMarkBad(name, msg){
    var wrap = els.sheetContent.querySelector('[data-field="' + name + '"]');
    if (wrap){
      wrap.classList.add('is-bad');
      wrap.classList.remove('is-shake');
      void wrap.offsetWidth;
      wrap.classList.add('is-shake');
      setTimeout(function(){ wrap.classList.remove('is-shake'); }, 340);
      var input = wrap.querySelector('input');
      if (input){
        try { input.scrollIntoView({ block:'center', behavior:'smooth' }); } catch(e){ try{ input.scrollIntoView(); }catch(e2){} }
        setTimeout(function(){ try { input.focus({ preventScroll:true }); } catch(e){ try{ input.focus(); }catch(e2){} } }, 240);
      }
    }
    showToast(msg);
  }
  function sheetOpen(){ return !!els.sheetWrap && !els.sheetWrap.hidden && els.sheetWrap.classList.contains('open'); }
  // 写完再读一遍，确认真的落盘，避免“看起来保存了其实没写进去”
  function storedHold(code){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      var r = (d && Array.isArray(d.recs) ? d.recs : []).filter(function(x){ return x && x.code === code; })[0];
      return r && r.hold ? { price:Number(r.hold.price), date:String(r.hold.date || '') } : null;
    }catch(e){ return null; }
  }
  function flashCard(code){
    var card = document.querySelector('#view-watch .rec-card[data-code="' + code + '"]')
      || document.querySelector('.rec-card[data-code="' + code + '"]');
    if (!card) return;
    card.classList.remove('is-flash');
    void card.offsetWidth;
    card.classList.add('is-flash');
    setTimeout(function(){ card.classList.remove('is-flash'); }, 1300);
    try { card.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){}
  }

  function submitHold(code){
    if (ui.holdSaving) return;
    var rec = state.recs.find(function(r){ return r.code === code; });
    var form = els.sheetContent.querySelector('#holdForm');
    if (!rec){ closeSheet(); showToast('该标的已不在跟踪列表，未保存'); return; }
    if (!form) return;
    var priceEl = form.querySelector('#h-price');
    var dateEl = form.querySelector('#h-date');
    var noteEl = form.querySelector('#h-note');
    var raw = priceEl ? priceEl.value.trim() : '';
    var price = parsePriceInput(raw);
    var date = normDayKey(dateEl ? dateEl.value : '');
    var note = noteEl ? noteEl.value.trim() : '';
    holdSetErr('hprice', ''); holdSetErr('hdate', '');
    var wrapP = form.querySelector('[data-field="hprice"]');
    var wrapD = form.querySelector('[data-field="hdate"]');
    if (wrapP) wrapP.classList.remove('is-bad');
    if (wrapD) wrapD.classList.remove('is-bad');

    if (!raw){ holdSetErr('hprice', '请填写买入价，例如 9.80'); holdMarkBad('hprice', '买入价还没填，未保存'); return; }
    if (!Number.isFinite(price) || price <= 0 || price > 1000000){
      holdSetErr('hprice', '价格格式不对，请填数字，例如 9.80');
      holdMarkBad('hprice', '买入价格式不对，未保存');
      return;
    }
    if (!date){ holdSetErr('hdate', '请选择买入日期'); holdMarkBad('hdate', '还没选买入日期，未保存'); return; }
    if (date > todayLabel(Date.now())){ holdSetErr('hdate', '买入日期不能晚于今天'); holdMarkBad('hdate', '买入日期不能晚于今天，未保存'); return; }

    ui.holdSaving = true;
    var btn = form.querySelector('[data-act="hold-save"]');
    var btnLabel = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = '保存中…'; }

    var had = !!holdOf(rec);
    rec.hold = { price:round2(price), date:date, note:note, at:Date.now() };
    save();

    var back = storedHold(code);
    var wrote = !!back && Math.abs(back.price - round2(price)) < 0.0001 && back.date === date;
    if (!wrote){
      ui.holdSaving = false;
      if (btn){ btn.disabled = false; btn.textContent = btnLabel; }
      var okFail = form.querySelector('#holdOk');
      if (okFail) okFail.textContent = '保存失败';
      showToast('本地存储写入失败，请退出无痕模式后重试');
      return;
    }

    if (btn) btn.textContent = '已保存 ✓';
    var okEl = form.querySelector('#holdOk');
    if (okEl) okEl.textContent = '已保存';
    ui.holdBack = '';
    setTimeout(function(){
      ui.holdSaving = false;
      closeSheet();
      renderCurrent();
      showToast((had ? '已更新买入价 ¥' : '已记录买入价 ¥') + fmtPrice(price) + ' · ' + date);
      // 弹层收起动画结束后再刷一次列表，确保卡片上的买入信息与数据一致
      setTimeout(function(){
        if (ui.tab === 'watch') renderWatchList();
        else renderCurrent();
        flashCard(code);
      }, 260);
    }, 320);
  }

  function clearHold(code){
    var rec = state.recs.find(function(r){ return r.code === code; });
    if (!rec || !holdOf(rec)){ showToast('当前没有可清除的买入记录'); return; }
    var back = ui.holdBack || '';

    else closeSheet();

    showToast('已清除该股的买入记录');
    flashCard(code);
  }

  function bindImport(){
    var ta = els.sheetContent.querySelector('#srcText');
    if (ta){
      ta.addEventListener('input', function(){
        ui.importText = ta.value;
        var c = els.sheetContent.querySelector('#srcCount');
        if (c) c.textContent = ta.value.trim().length + ' 字';
        clearTimeout(ui.parseTimer);
        ui.parseTimer = setTimeout(refreshParse, 220);
      });
    }
    var list = els.sheetContent.querySelector('#parseList');
    if (list){
      list.addEventListener('input', function(e){
        var input = e.target.closest('input[data-field]');
        if (!input) return;
        var card = input.closest('.import-card');
        var it = ui.parsed[Number(card.dataset.idx)];
        if (!it) return;
        var f = input.dataset.field, v = input.value;
        if (f === 'buyLow' || f === 'buyHigh' || f === 'sellHigh' || f === 'sellLow'){
          var n = Number(v);
          it[f] = (v === '' || !isFinite(n)) ? NaN : round2(n);
        } else {
          it[f] = v;
        }
        clearTimeout(ui.validateTimer);
        ui.validateTimer = setTimeout(function(){
          updateCardState(Number(card.dataset.idx));
        }, 260);
      });
    }
    refreshParse();
  }

  function refreshParse(){
    if (!els.sheetContent) return;
    var ta = els.sheetContent.querySelector('#srcText');
    if (!ta) return;
    var text = ta.value;
    ui.importText = text;
    var exist = state.recs.map(function(r){ return r.code; });
    var res = text.trim() ? pParse(text, { known:BROKERS, existing:exist }) : { items:[] };
    ui.parsed = res.items;
    renderParseList();
  }

  function icField(idx, field, label, type, value, extra){
    return '<label class="ic-field"><span>' + label + '</span>'
      + '<input type="' + type + '" data-idx="' + idx + '" data-field="' + field + '" value="' + esc(value == null ? '' : value) + '"' + (extra || '') + '></label>';

  function numField(v){ return isFinite(v) ? String(v) : ''; }

  function cardHtml(it, idx){
    var cls = 'import-card' + (it.dup ? ' is-dup' : (it.ok ? '' : ' is-bad'));
    var badge = it.dup ? '<span class="ic-badge dup">已在跟踪</span>'

      + '<div class="ic-head"><div class="ic-title"><strong>' + esc(it.name || '未识别名称') + '</strong><span class="ic-code">' + esc(it.code || '—') + '</span></div>'

  function updateCardState(idx){
    var it = ui.parsed[idx];
    if (!it) return;
    var v = pValidate(it, state.recs.map(function(r){ return r.code; }));
    it.issues = v.issues; it.dup = v.dup; it.ok = v.ok;
    var card = els.sheetContent.querySelector('.import-card[data-idx="' + idx + '"]');
    if (card){
      card.classList.toggle('is-bad', !it.ok && !it.dup);
      card.classList.toggle('is-dup', it.dup);
      var badge = card.querySelector('.ic-badge');
      if (badge){
        badge.className = 'ic-badge ' + (it.dup ? 'dup' : (it.ok ? 'ok' : 'bad'));
        badge.textContent = it.dup ? '已在跟踪' : (it.ok ? '可录入' : '需补全');
      }
      var issue = card.querySelector('.ic-issue');
      if (it.issues.length){
        if (!issue){
          issue = document.createElement('p');
          issue.className = 'ic-issue';
          var grid = card.querySelector('.ic-grid');
          if (grid) grid.insertAdjacentElement('afterend', issue);
        }
        issue.textContent = '缺漏：' + it.issues.join('；');
      } else if (issue){
        issue.remove();
      }
      var title = card.querySelector('.ic-title strong');
      if (title) title.textContent = it.name || '未识别名称';
      var codeEl = card.querySelector('.ic-code');
      if (codeEl) codeEl.textContent = it.code || '—';
    }
    updateCommitState();
  }

  function pasteFromClipboard(){
    var ta = els.sheetContent.querySelector('#srcText');
    if (!ta) return;
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(txt){
        if (!txt || !txt.trim()){ ta.focus({ preventScroll:true }); return; }

        ui.importText = txt;
        var c = els.sheetContent.querySelector('#srcCount');

      }).catch(function(){
        ta.focus({ preventScroll:true });
        alert('浏览器未允许直接读取剪贴板，请在输入框中长按粘贴。');
      });
    } else {
      ta.focus({ preventScroll:true });
      alert('当前浏览器不支持直接读取剪贴板，请在输入框中长按粘贴。');
    }
  }

  function dropParsed(idx){
    if (!ui.parsed[idx]) return;
    ui.parsed.splice(idx, 1);
    renderParseList();
  }

  function commitImport(){
    var existCodes = state.recs.map(function(r){ return r.code; });
    ui.parsed.forEach(function(it){
      var v = pValidate(it, existCodes);
      it.issues = v.issues; it.dup = v.dup; it.ok = v.ok;
    });
    var items = ui.parsed.filter(function(i){ return i.ok; });
    if (!items.length){ renderParseList(); return; }
    var now = Date.now(), n = 0;
    items.forEach(function(it){
      if (state.recs.some(function(r){ return r.code === it.code; })) return;
      var rec = {
        id: uid(), code: it.code, name: it.name, broker: it.broker || it.source || '券商推荐',
        buyLow: round2(it.buyLow), buyHigh: round2(it.buyHigh),
        sellHigh: round2(it.sellHigh), sellLow: round2(it.sellLow),
        createdAt: now, dateLabel: it.date || todayLabel(now),
        lastPrice: null, priceDate: null, priceTs: 0, priceSrc: '待补齐',
        closes: [],
        note: it.reason || '', position: it.position || '', advisor: it.advisor || '',
        source: it.source || '', lastStatusKey: null, lastStrongKey: null,
        feedState: 'pending', feedMsg: ''
      };
      rec.lastStatusKey = statusOf(rec).key;
      state.recs.unshift(rec);
      n++;
    });
    if (!n) return;
    save();
    ui.importText = '';
    ui.parsed = [];
    ui.banner = { ts: now, source: 'import', count: n, total: state.recs.length };
    closeSheet();
    ui.filter = 'all';
    ui.search = '';
    if (ui.built.watch) syncChips();
    setTab('watch');
    updateNav();
    showToast('已录入 ' + n + ' 条推荐，正在补齐推荐日之后的收盘价');
    syncAll({ reason:'import', silent:true });
  }

  function readNum(id){
    var el = els.sheetContent.querySelector('#' + id);
    var raw = el ? el.value.trim() : '';
    if (!raw) return NaN;
    var v = Number(raw);
    return Number.isFinite(v) ? v : NaN;
  }

  function setErr(name, msg){
    var el = els.sheetContent.querySelector('[data-err="' + name + '"]');
    if (el) el.textContent = msg || '';
  }

  function submitForm(existing){
    var code = (els.sheetContent.querySelector('#f-code').value || '').trim();
    var name = (els.sheetContent.querySelector('#f-name').value || '').trim();
    var broker = (els.sheetContent.querySelector('#f-broker').value || '').trim();
    var dateVal = els.sheetContent.querySelector('#f-date').value || todayLabel(Date.now());
    var note = (els.sheetContent.querySelector('#f-note').value || '').trim();
    var posVal = (els.sheetContent.querySelector('#f-pos') ? els.sheetContent.querySelector('#f-pos').value : '').trim();
    var advVal = (els.sheetContent.querySelector('#f-adv') ? els.sheetContent.querySelector('#f-adv').value : '').trim();
    var buyLow = readNum('f-buyLow'), buyHigh = readNum('f-buyHigh');
    var sellHigh = readNum('f-sellHigh'), sellLow = readNum('f-sellLow');
    ['code','name','buyLow','buyHigh','sellHigh','sellLow'].forEach(function(k){ setErr(k, ''); });
    var bad = false;

    if (!/^\d{6}$/.test(code)){ setErr('code', '请输入 6 位数字代码'); bad = true; }
    else {
      var dup = state.recs.some(function(r){ return r.code === code && (!existing || r.id !== existing.id); });
      if (dup){ setErr('code', '该股票已在跟踪列表中'); bad = true; }
    }
    if (!name){ setErr('name', '请输入股票名称'); bad = true; }
    if (!broker){ setErr('broker', '请输入推荐机构'); bad = true; }
    if (!Number.isFinite(buyLow) || buyLow <= 0){ setErr('buyLow', '请输入有效价格'); bad = true; }
    if (!Number.isFinite(buyHigh) || buyHigh <= 0){ setErr('buyHigh', '请输入有效价格'); bad = true; }
    if (Number.isFinite(buyLow) && Number.isFinite(buyHigh) && buyLow >= buyHigh){ setErr('buyHigh', '上限需大于下限'); bad = true; }
    if (!Number.isFinite(sellHigh) || sellHigh <= 0){ setErr('sellHigh', '请输入有效价格'); bad = true; }
    if (!Number.isFinite(sellLow) || sellLow <= 0){ setErr('sellLow', '请输入有效价格'); bad = true; }
    if (Number.isFinite(sellHigh) && Number.isFinite(buyHigh) && sellHigh <= buyHigh){ setErr('sellHigh', '止盈价应高于买入上限'); bad = true; }
    if (Number.isFinite(sellLow) && Number.isFinite(buyLow) && sellLow >= buyLow){ setErr('sellLow', '止损价应低于买入下限'); bad = true; }

    if (bad){
      var firstErr = els.sheetContent.querySelector('.err:not(:empty)');
      if (firstErr){
        var input = firstErr.parentElement.querySelector('input,textarea');
        if (input) input.focus();
      }
      return;
    }

    var now = Date.now();
    if (existing){
      existing.code = code; existing.name = name; existing.broker = broker;
      existing.dateLabel = dateVal; existing.note = note;
      existing.position = posVal; existing.advisor = advVal;
      existing.buyLow = round2(buyLow); existing.buyHigh = round2(buyHigh);
      existing.sellHigh = round2(sellHigh); existing.sellLow = round2(sellLow);
      existing.lastStatusKey = statusOf(existing).key;
      save(); closeSheet(); renderCurrent(); updateNav();
      return;
    }

    var rec = {
      id: uid(), code: code, name: name, broker: broker,
      buyLow: round2(buyLow), buyHigh: round2(buyHigh),
      sellHigh: round2(sellHigh), sellLow: round2(sellLow),
      createdAt: now, dateLabel: dateVal,
      lastPrice: null, priceDate: null, priceTs: 0, priceSrc: '待同步',
      closes: [], note: note, position: posVal, advisor: advVal, source: '',
      lastStatusKey: 'none', lastStrongKey: null, feedState: 'pending', feedMsg: ''
    };
    state.recs.unshift(rec);
    save();
    closeSheet();
    syncOne(code, { silent: true }).then(function(){ renderCurrent(); });
    ui.filter = 'all';
    if (ui.built.watch) syncChips();
    renderCurrent();
    updateNav();
  }

  function confirmDelete(code){
    var rec = state.recs.find(function(r){ return r.code === code; });
    if (!rec) return;
    var pn = state.pushes.filter(function(p){ return p.code === code; }).length;
    var cn = closeList(rec).length;
    var html = '<div class="sheet-head"><div><h2 id="sheetTitle">删除跟踪标的</h2>'
      + '<p class="rec-sub">' + esc(rec.name) + ' · ' + esc(rec.code) + '</p></div>' + closeIcon() + '</div>'
      + '<p class="confirm-text">将移除该标的的推荐记录、' + cn + ' 个交易日收盘价'
      + (pn ? ('和 ' + pn + ' 条提醒') : '') + '。删除后会在页面顶部保留「撤销」入口，可立即恢复。</p>'
      + '<div class="sheet-actions"><button class="btn btn-ghost" data-close="1">取消</button>'
      + '<button class="btn btn-danger" data-act="confirm-del" data-code="' + esc(rec.code) + '">确认删除</button></div>';
    ui.sheetFrom = 'confirm:' + code;
    openSheet(html);
  }

  function deleteRec(code){
    var idx = -1;
    for (var i = 0; i < state.recs.length; i++){ if (state.recs[i].code === code){ idx = i; break; } }
    if (idx < 0) return false;
    var rec = state.recs[idx];
    var pushes = state.pushes.filter(function(p){ return p.code === code; });
    state.recs.splice(idx, 1);
    state.pushes = state.pushes.filter(function(p){ return p.code !== code; });
    ui.banner = { source:'deleted', ts:Date.now(), name:rec.name, code:code, rec:rec, index:idx, pushes:pushes, total:state.recs.length };
    if (ui.filter === 'hold'){ /* 保持筛选，列表会自然少一条 */ }
    save();
    closeSheet();
    renderCurrent();
    updateNav();
    showToast('已删除 ' + rec.name);
    return true;
  }

  function undoDelete(){
    var b = ui.banner;
    if (!b || b.source !== 'deleted' || !b.rec) return;
    var at = Math.min(Math.max(b.index, 0), state.recs.length);
    if (state.recs.some(function(r){ return r.code === b.code; })){ showToast('该标的已在列表中'); return; }
    state.recs.splice(at, 0, b.rec);
    if (b.pushes && b.pushes.length){
      state.pushes = state.pushes.concat(b.pushes).sort(function(x, y){ return y.ts - x.ts; }).slice(0, 200);
    }
    ui.banner = { source:'restored', ts:Date.now(), name:b.name, total:state.recs.length };
    save();
    renderCurrent();
    updateNav();
    showToast('已恢复 ' + b.name);
  }

  function confirmClear(){
    var html = '<div class="sheet-head"><div><h2 id="sheetTitle">清空全部数据</h2></div>' + closeIcon() + '</div>'
      + '<p class="confirm-text">将删除本浏览器内保存的 ' + state.recs.length + ' 条推荐、' + state.pushes.length + ' 条提醒和全部检查记录，并恢复默认计划。此操作不可撤销，建议先导出备份。</p>'
      + '<div class="sheet-actions"><button class="btn btn-ghost" data-close="1">取消</button>'
      + '<button class="btn btn-danger" data-act="confirm-clear">确认清空</button></div>';
    openSheet(html);
  }

  /* ============ 导出 ============ */
  function exportJson(){
    var payload = {
      app: 'stock-pulse', version: 2, exportedAt: new Date().toISOString(),
      recs: state.recs, pushes: state.pushes, logs: state.logs,
      settings: { vol: state.settings.vol, notify: false, priceView: state.settings.priceView, schedules: state.settings.schedules.map(function(s){
        return { time: s.time, label: s.label, enabled: s.enabled };
      }) }
    };
    try{
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '盯盘助手_推荐跟踪_' + dateKey(new Date()) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    }catch(e){
      console.warn('导出失败', e);
      alert('导出失败：浏览器不支持本地文件下载。');
    }
  }

  /* ============ 交互 ============ */
  function setTab(tab){
    if (!els.views[tab]) tab = 'dashboard';
    ui.tab = tab;
    Object.keys(els.views).forEach(function(k){ els.views[k].hidden = (k !== tab); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function(b){
      if (b.classList.contains('nav-item') || b.classList.contains('tab')) b.classList.toggle('is-active', b.dataset.tab === tab);
    });
    var titles = {
      dashboard:['今日看板','按每日收盘价比对推荐区间'],
      watch:['推荐跟踪','每日收盘价与推荐区间比对'],
      alerts:['提醒推送','收盘价与推荐区间的比对记录'],
      settings:['计划与设置','收盘价更新、推送与本地数据']
    };
    els.pageTitle.textContent = titles[tab][0];
    els.pageSub.textContent = titles[tab][1];
    if (tab === 'watch' && !ui.built.watch) buildWatch();
    if (tab === 'settings') buildSettings();
    renderCurrent();
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function updateNav(){
    var unread = state.pushes.filter(function(p){ return !p.read; }).length;
    Array.prototype.forEach.call(document.querySelectorAll('[data-badge]'), function(b){
      if (unread > 0){ b.hidden = false; b.textContent = unread > 99 ? '99+' : String(unread); }
      else { b.hidden = true; b.textContent = '0'; }
    });
  }

  function renderCurrent(){
    if (ui.tab === 'dashboard') renderDashboard();
    else if (ui.tab === 'watch'){ if (!ui.built.watch) buildWatch(); else { renderWatchList(); } }
    else if (ui.tab === 'alerts') renderAlerts();
    else if (ui.tab === 'settings' && ui.built.settings){ renderSchedules(); }
    updateNav();
  }

  function handleAction(act, el){
    switch(act){
      case 'run-check':
        runCheck({ source:'manual', label:'手动更新收盘价' });
        break;
      case 'view-mode':
        var nextView = el.dataset.mode === 'chart' ? 'chart' : 'list';
        if (state.settings.priceView === nextView) break;
        state.settings.priceView = nextView;
        save();
        Array.prototype.forEach.call(document.querySelectorAll('.vs-btn'), function(b){
          var on = b.dataset.mode === nextView;
          b.classList.toggle('is-active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        renderCurrent();
        break;
      case 'open-form':
        openImport();
        break;
      case 'import-mode':
        switchImportMode(el.dataset.mode);
        break;
      case 'import-paste':
        pasteFromClipboard();
        break;
      case 'import-sample':
        fillSample();
        break;
      case 'import-clear':
        clearSrc();
        break;
      case 'import-drop':
        dropParsed(Number(el.dataset.idx));
        break;
      case 'import-commit':
        commitImport();
        break;
      case 'dismiss-banner':
        ui.banner = null; renderCurrent();
        break;
      case 'filter':
        ui.filter = el.dataset.filter || 'all';
        syncChips();
        renderWatchList();
        break;
      case 'mark-all-read':
        state.pushes.forEach(function(p){ p.read = true; });
        save(); renderAlerts(); updateNav();
        break;
      case 'add-schedule':
        state.settings.schedules.push({ id: uid(), time:'15:20', label:'新增更新', enabled:true, lastRunKey:null });
        state.settings.schedules.sort(function(a,b){ return a.time.localeCompare(b.time); });
        save(); renderSchedules(); renderCurrent();
        break;
      case 'del-schedule':
        state.settings.schedules = state.settings.schedules.filter(function(s){ return s.id !== el.dataset.id; });
        save(); renderSchedules(); renderCurrent();
        break;
      case 'test-notify':
        if (typeof Notification === 'undefined'){
          alert('当前浏览器不支持系统通知，提醒只会出现在「提醒推送」页。');
          break;
        }
        if (!state.settings.notify || Notification.permission !== 'granted'){
          alert('请先开启系统通知开关并允许权限。');
          break;
        }
        notifySystem(APP_NAME + ' · 测试通知', '这是一条测试提醒，正式提醒会在价格状态变化时发送。');
        break;
      case 'feed-mode':
        state.settings.feed.mode = el.dataset.mode;
        feedConfig();
        save();
        buildSettings();
        renderCurrent();
        showToast('数据源已切换为「' + feedName() + '」');
        break;
      case 'test-feed':
        var out = document.getElementById('feedTest');
        if (out) out.textContent = '正在连接…';
        testFeed().then(function(r){
          var msg = '连接正常 · 用时 ' + r.ms + 'ms · 样例 600519 最新收盘 ' + r.last.d + ' ¥' + fmtPrice(r.last.p);
          if (out) out.textContent = msg;
          showToast('数据源可用');
        }).catch(function(e){
          var msg = '连接失败：' + ((e && e.message) || '未知错误');
          if (out) out.textContent = msg;
          showToast(msg);
        });
        break;
      case 'download-proxy':
        downloadProxySource();
        break;
      case 'sync-one':
        syncOne(el.dataset.code).then(function(res){
          if (res) openDetail(el.dataset.code);
        });
        break;
      case 'clear-logs':
        state.logs = [];
        save();
        buildSettings();
        renderCurrent();
        break;
      case 'export':
        exportJson();
        break;
      case 'clear-all':
        confirmClear();
        break;
      case 'confirm-clear':
        state = { version:1, recs: [], pushes: [], logs: [], settings: defaultSettings(), createdAt: Date.now() };
        ui.built = { watch:false, settings:false };
        ui.filter = 'all'; ui.search = ''; ui.banner = null;
        save(); closeSheet(); renderCurrent(); updateNav();
        break;
      case 'edit':
        var editRec = state.recs.find(function(r){ return r.code === el.dataset.code; });
        if (editRec) openForm(editRec);
        break;
      case 'detail':
        openDetail(el.dataset.code);
        break;
      case 'more':
        openActions(el.dataset.code);
        break;
      case 'hold':
        openHoldForm(el.dataset.code, sheetOpen() ? ui.sheetFrom : '');
        break;
      case 'hold-save':
        submitHold(el.dataset.code);
        break;
      case 'hold-clear':
        clearHold(el.dataset.code);
        break;
      case 'del':
        confirmDelete(el.dataset.code);
        break;
      case 'confirm-del':
        deleteRec(el.dataset.code);
        break;
      case 'undo-del':
        undoDelete();
        break;
      default: break;
    }
  }

  function bindGlobal(){
    document.addEventListener('click', function(e){
      var tabBtn = e.target.closest('[data-tab]');
      if (tabBtn){ setTab(tabBtn.dataset.tab); return; }
      var closeEl = e.target.closest('[data-close]');
      if (closeEl){ closeSheet(); return; }
      var actEl = e.target.closest('[data-act]');
      if (actEl){ handleAction(actEl.dataset.act, actEl); return; }
      var card = e.target.closest('.rec-card, .chart-card');
      if (card && !e.target.closest('.sheet')){ openDetail(card.dataset.code); return; }
    });

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && !els.sheetWrap.hidden){ closeSheet(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && (document.activeElement.classList.contains('rec-card') || document.activeElement.classList.contains('chart-card'))){
        e.preventDefault();
        openDetail(document.activeElement.dataset.code);
      }
    });

    document.addEventListener('visibilitychange', function(){
      if (!document.hidden){
        tickClock();
        renderCurrent();
        var f = feedConfig();
        if (f.autoSync && state.recs.length && (!f.lastSyncAt || Date.now() - f.lastSyncAt > 15 * 60000)){
          syncAll({ reason:'init', silent:true });
        }
      }
    });
  }

  function init(){
    els.dashboard = document.getElementById('view-dashboard');
    els.watch = document.getElementById('view-watch');
    els.alerts = document.getElementById('view-alerts');
    els.settings = document.getElementById('view-settings');
    els.views = { dashboard: els.dashboard, watch: els.watch, alerts: els.alerts, settings: els.settings };
    els.pageTitle = document.getElementById('pageTitle');
    els.pageSub = document.getElementById('pageSub');
    els.topClock = document.getElementById('topClock');
    els.railClock = document.getElementById('railClock');
    els.sheetWrap = document.getElementById('sheetWrap');
    els.sheet = els.sheetWrap.querySelector('.sheet');
    els.sheetContent = document.getElementById('sheetContent');

    load();
    bindGlobal();
    renderCurrent();
    updateNav();
    tickClock();
    setInterval(tickClock, 1000);
    setTimeout(bootstrapSync, 500);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
