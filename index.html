<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>盯盘助手 · 券商推荐跟踪台</title>
<meta name="description" content="粘贴券商推荐原文自动识别股票信息，每天收盘后自动拉取A股日收盘价并与买入、止盈、止损区间比对，支持列表与折线双视图。">
<meta name="theme-color" content="#070a10">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#070a10;--panel:#0f1622;--panel-2:#131c2a;--panel-3:#17202f;
    --line:rgba(148,163,184,.14);--line-2:rgba(148,163,184,.08);
    --text:#e9eef7;--muted:#8b98ac;--dim:#5d6a7e;
    --accent:#2dd4bf;--accent-soft:rgba(45,212,191,.12);
    --blue:#38bdf8;--amber:#fbbf24;--orange:#fb923c;--rose:#fb7185;
    --up:#f87171;--down:#34d399;
    --r-lg:18px;--r-md:14px;--r-sm:10px;
    --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 420px at 12% -8%,rgba(45,212,191,.10),transparent 62%),
      radial-gradient(760px 420px at 92% 0%,rgba(56,189,248,.08),transparent 58%);
  }
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;cursor:pointer}
  h1,h2,h3,h4,p{margin:0}
  ul,ol{margin:0;padding:0;list-style:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---------- layout ---------- */
  .app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 14px 96px}
  .rail{display:none}
  .main{min-width:0}
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 2px 10px;margin-bottom:4px;
    background:linear-gradient(180deg,rgba(7,10,16,.96) 60%,rgba(7,10,16,.72));
    backdrop-filter:blur(12px);
  }
  .top-left h1{font-size:19px;font-weight:650;letter-spacing:.2px}
  .top-left p{font-size:11.5px;color:var(--muted);margin-top:2px}
  .top-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .clock-pill{
    font-size:11.5px;color:var(--muted);padding:5px 9px;border:1px solid var(--line);
    border-radius:999px;background:rgba(255,255,255,.03)
  }
  .view{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);
    padding:9px 14px;border-radius:11px;font-size:13px;font-weight:550;
    transition:background .18s,border-color .18s,transform .12s;white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.07)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-primary{background:linear-gradient(180deg,#2dd4bf,#14b8a6);color:#04201d;border-color:transparent;font-weight:650}
  .btn-primary:hover{background:linear-gradient(180deg,#3ee0ca,#16c2ae)}
  .btn-ghost{background:transparent}
  .btn-ghost:hover{background:rgba(255,255,255,.05)}
  .btn-danger{color:#fda4af;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}
  .btn:disabled{opacity:.42;cursor:not-allowed}
  .btn:disabled:hover{background:rgba(255,255,255,.04)}
  .btn-primary:disabled:hover{background:linear-gradient(180deg,#2dd4bf,#14b8a6)}
  .btn:disabled:active{transform:none}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}
  .btn-block{width:100%}
  .icon-btn{
    width:32px;height:32px;display:grid;place-items:center;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.04)
  }
  .icon-btn:hover{background:rgba(255,255,255,.08)}

  /* ---------- hero ---------- */
  .hero{
    position:relative;overflow:hidden;margin:6px 0 14px;padding:16px;
    border:1px solid var(--line);border-radius:var(--r-lg);
    background:linear-gradient(145deg,rgba(45,212,191,.10),rgba(15,22,34,.92) 46%,rgba(15,22,34,.98));
    box-shadow:var(--shadow);
  }
  .hero::after{
    content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(45,212,191,.22),transparent 68%);pointer-events:none;
  }
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#7fe9dc;letter-spacing:.4px}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}70%{box-shadow:0 0 0 9px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
  .hero-next{margin-top:10px;font-size:13px;color:var(--muted)}
  .hero-next strong{display:block;margin-top:4px;font-size:23px;font-weight:680;color:var(--text);letter-spacing:.3px}
  .hero-sub{margin-top:6px;font-size:11.5px;color:var(--dim);line-height:1.6}
  .hero-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .hero-actions .btn{flex:1 1 auto;min-width:132px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
  .stat{
    padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-md);
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  }
  .stat .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .stat .v{margin-top:6px;font-size:22px;font-weight:680;letter-spacing:.4px}
  .stat .n{font-size:11px;color:var(--dim);margin-top:2px}
  .stat.accent .v{color:var(--accent)}
  .stat.warn .v{color:var(--amber)}

  /* ---------- section ---------- */
  .section{margin-bottom:18px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .section-head h2{font-size:14.5px;font-weight:620}
  .section-head .more{font-size:12px;color:var(--muted);background:none;border:0;padding:2px 0}
  .section-head .more:hover{color:var(--accent)}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.7}

  .banner{
    display:flex;align-items:flex-start;gap:9px;margin:6px 0 12px;padding:10px 12px;
    border:1px solid rgba(45,212,191,.28);background:rgba(45,212,191,.09);
    border-radius:12px;font-size:12px;color:#c5f6ee;line-height:1.6;
  }
  .banner .b-close{margin-left:auto;background:none;border:0;color:#8fe6d9;font-size:14px;padding:0 2px;line-height:1}

  /* ---------- rec card ---------- */
  .card-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:11px}
  .rec-card{
    position:relative;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.014)),var(--panel);
    cursor:pointer;transition:border-color .18s,transform .12s,background .18s;
  }
  .rec-card:hover{border-color:rgba(45,212,191,.32)}
  .rec-card:active{transform:scale(.995)}
  .rec-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .rec-id{display:flex;align-items:center;gap:7px;min-width:0}
  .code{
    flex:0 0 auto;font-size:10.5px;letter-spacing:.4px;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:rgba(255,255,255,.04)
  }
  .rec-id h3{font-size:15px;font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec-sub{font-size:11px;color:var(--dim);margin-top:4px}
  .rec-price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:10px 0 2px}
  .rec-price .lbl{font-size:11px;color:var(--muted);margin-right:6px}
  .rec-price strong{font-size:19px;font-weight:660;letter-spacing:.2px}
  .dev{font-size:12px;font-weight:600}
  .up{color:var(--up)}
  .down{color:var(--down)}
  .flat{color:var(--muted)}

  .pill{
    flex:0 0 auto;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid transparent;
    white-space:nowrap;font-weight:550
  }
  .tone-op{color:#7dd3fc;background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.30)}
  .tone-ok{color:#5eead4;background:rgba(45,212,191,.13);border-color:rgba(45,212,191,.30)}
  .tone-warn{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.28)}
  .tone-take{color:#fdba74;background:rgba(251,146,60,.13);border-color:rgba(251,146,60,.30)}
  .tone-stop{color:#fda4af;background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.30)}
  .tone-muted{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}

  .pbar{position:relative;margin-top:36px;padding-bottom:16px}
  .pbar-track{position:relative;height:8px;border-radius:5px;background:rgba(255,255,255,.055);border:1px solid var(--line-2)}
  .band{position:absolute;top:0;bottom:0;border-radius:4px}
  .band-sell{top:-7px;bottom:auto;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(251,146,60,.75),rgba(251,113,133,.75))}
  .band-buy{background:linear-gradient(90deg,rgba(45,212,191,.62),rgba(45,212,191,.42));box-shadow:0 0 14px rgba(45,212,191,.25)}
  .pbar-marker{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;border-radius:2px;background:#f1f5f9;box-shadow:0 0 0 2px rgba(7,10,16,.85)}
  .pbar-marker .chip{
    position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);
    font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap;
    background:#0b1220;border:1px solid rgba(255,255,255,.22);color:#f8fafc;box-shadow:0 4px 10px rgba(0,0,0,.5)
  }
  .pbar-marker.edge-r .chip{left:auto;right:0;transform:none}
  .pbar-marker.edge-l .chip{left:0;transform:none}
  .pbar-scale{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}

  .rec-ranges{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);margin-top:10px}
  .rec-ranges span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
  .dot-buy{background:var(--accent)}
  .dot-sell{background:var(--orange)}
  .dot-stop{background:var(--rose)}
  .rec-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line-2);font-size:10.5px;color:var(--dim)}
  .rec-delta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
  .delta{font-size:13px;font-weight:660;letter-spacing:.2px}
  .delta-sub{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .rec-foot .foot-trend{white-space:nowrap;color:var(--muted)}

  /* ---------- view switch ---------- */
  .watch-bar{display:flex;align-items:center;gap:9px;margin:0 0 10px}
  .bar-title{font-size:11.5px;color:var(--muted)}
  .bar-note{margin-left:auto;font-size:10.5px;color:var(--dim);white-space:nowrap}
  .view-switch{display:inline-flex;padding:2px;gap:2px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03);flex:0 0 auto}
  .vs-btn{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:550;padding:4px 11px;border-radius:7px;line-height:1.5}
  .vs-btn.is-active{background:var(--accent-soft);color:#7fe9dc;box-shadow:inset 0 0 0 1px rgba(45,212,191,.28)}
  .vs-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .head-tools{display:flex;align-items:center;gap:9px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}

  /* ---------- close chart ---------- */
  .chart-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:11px}
  .chart-card{
    padding:13px;border:1px solid var(--line);border-radius:var(--r-lg);
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.014)),var(--panel);
    cursor:pointer;transition:border-color .18s
  }
  .chart-card:hover{border-color:rgba(45,212,191,.32)}
  .chart-card:active{transform:scale(.995)}
  .chart-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chart-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chart-price{display:flex;align-items:baseline;gap:8px;margin-top:7px;flex-wrap:wrap}
  .chart-price strong{font-size:20px;font-weight:670;letter-spacing:.2px}
  .chart-price .chart-date{margin-left:auto;font-size:10.5px;color:var(--dim);white-space:nowrap}
  .chart-body{margin-top:4px}
  .chart-svg{display:block;width:100%;height:auto}
  .chart-legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:5px;font-size:10.5px;color:var(--muted)}
  .chart-legend span{display:inline-flex;align-items:center;white-space:nowrap}
  .lg-line{width:12px;height:2px;border-radius:2px;background:var(--accent);margin-right:4px}
  .lg-band{width:12px;height:8px;border-radius:2px;background:rgba(45,212,191,.22);margin-right:4px}
  .lg-hold{width:12px;height:0;border-top:2px dashed #38bdf8;margin-right:4px}
  .chart-empty{padding:26px 10px;text-align:center;font-size:11.5px;color:var(--dim);border:1px dashed var(--line-2);border-radius:10px}
  .detail-chart{margin-top:8px;padding:10px 8px 4px;border:1px solid var(--line-2);border-radius:12px;background:rgba(255,255,255,.02)}
  @media (min-width:760px){ .chart-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---------- filters ---------- */
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip-btn{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.03);font-size:12px;color:var(--muted);white-space:nowrap
  }
  .chip-btn.is-active{background:var(--accent-soft);border-color:rgba(45,212,191,.42);color:#7fe9dc}
  .searchbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
  .searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:13px}
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar svg{flex:0 0 auto;color:var(--dim)}

  /* ---------- alerts ---------- */
  .alert-group{margin-bottom:16px}
  .alert-date{font-size:11px;color:var(--dim);margin:0 0 8px 2px;letter-spacing:.5px}
  .alert-item{
    display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;
    background:rgba(255,255,255,.03);margin-bottom:8px;position:relative;overflow:hidden
  }
  .alert-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--muted)}
  .alert-item.tone-ok::before{background:var(--accent)}
  .alert-item.tone-op::before{background:var(--blue)}
  .alert-item.tone-warn::before{background:var(--amber)}
  .alert-item.tone-take::before{background:var(--orange)}
  .alert-item.tone-stop::before{background:var(--rose)}
  .alert-main{min-width:0;flex:1}
  .alert-top{display:flex;align-items:center;gap:7px;justify-content:space-between}
  .alert-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .alert-time{flex:0 0 auto;font-size:10.5px;color:var(--dim)}
  .alert-body{font-size:11.5px;color:var(--muted);line-height:1.65;margin-top:4px}
  .unread-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

  .empty{
    padding:34px 18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-lg);
    background:rgba(255,255,255,.02)
  }
  .empty h3{font-size:14px;font-weight:600}
  .empty p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .empty .btn{margin-top:14px}

  /* ---------- settings ---------- */
  .panel{
    padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),var(--panel);
    margin-bottom:12px
  }
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .panel-head h2{font-size:14px;font-weight:620}
  .panel .hint{margin-top:8px}
  .sched-list{margin-top:10px;display:grid;gap:8px}
  .sched-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025)}
  .sched-row input[type="time"]{
    flex:0 0 auto;width:112px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:12.5px;padding:5px 5px;outline:none
  }
  .sched-row input.sched-label{
    flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-size:12px;padding:6px 8px;outline:none
  }
  .sched-row input[type="time"]:focus,.sched-row input.sched-label:focus{border-color:rgba(45,212,191,.5)}
  .sched-del{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;background:rgba(251,113,133,.1);color:#fda4af}
  .switch{position:relative;display:inline-flex;flex:0 0 auto;width:38px;height:22px;align-items:center;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch .track{width:100%;height:100%;border-radius:999px;background:rgba(255,255,255,.14);transition:background .18s}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#cbd5e1;transition:transform .18s,background .18s}
  .switch input:checked + .track{background:rgba(45,212,191,.5)}
  .switch input:checked + .track::after{transform:translateX(16px);background:#f0fdfa}
  .switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line-2)}
  .rowline:last-of-type{border-bottom:0}
  .rowline strong{display:block;font-size:12.5px;font-weight:600}
  .rowline small{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
  .range-wrap{display:flex;align-items:center;gap:10px;margin-top:6px}
  .range-wrap input[type="range"]{flex:1;min-width:0;accent-color:var(--accent);height:22px}
  .range-val{flex:0 0 auto;font-size:12px;color:#7fe9dc;min-width:44px;text-align:right}
  .note-box{padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line-2);font-size:11.5px;color:var(--muted);line-height:1.75}
  .note-box b{color:#cbd5e1;font-weight:600}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(10,15,23,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)
  }
  .tab{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:6px 2px;background:none;border:0;color:var(--dim);font-size:10.5px;position:relative
  }
  .tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tab.is-active{color:var(--accent)}
  .tab .badge{
    position:absolute;top:2px;left:calc(50% + 6px);min-width:15px;height:15px;padding:0 4px;border-radius:999px;
    background:#fb7185;color:#3b0713;font-size:9.5px;font-weight:700;line-height:15px;text-align:center
  }

  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .sheet-backdrop{position:absolute;inset:0;background:rgba(3,6,11,.72);opacity:0;transition:opacity .2s}
  .sheet-wrap.open .sheet-backdrop{opacity:1}
  .sheet{
    position:relative;width:100%;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
    background:linear-gradient(180deg,#111a27,#0c131d);border:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(14px);opacity:0;transition:transform .24s cubic-bezier(.22,.8,.3,1),opacity .2s;
    box-shadow:0 -20px 50px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch
  }
  .sheet-wrap.open .sheet{transform:none;opacity:1}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sheet-head h2{font-size:17px;font-weight:650;margin-top:3px}
  .sheet-actions{display:flex;gap:9px;margin-top:16px}
  .sheet-actions .btn{flex:1}

  .detail-price{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
  .detail-price .lbl{font-size:11px;color:var(--muted)}
  .detail-price strong{display:block;font-size:26px;font-weight:680;margin-top:2px;letter-spacing:.3px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:14px 0 0;background:var(--line-2);border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
  .kv div{background:#0f1622;padding:9px 11px}
  .kv dt{font-size:10.5px;color:var(--dim)}
  .kv dd{margin:3px 0 0;font-size:13px;font-weight:600}
  .kv div.wide{grid-column:1 / -1}
  .price-form{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line-2)}
  .price-form .flabel{font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px}
  .row{display:flex;gap:8px}
  .row input{flex:1;min-width:0}
  .hist{margin-top:8px;border:1px solid var(--line-2);border-radius:11px;overflow:hidden}
  .hist li{display:flex;justify-content:space-between;gap:8px;padding:7px 11px;font-size:11.5px;border-bottom:1px solid var(--line-2)}
  .hist li:last-child{border-bottom:0}
  .hist .muted{color:var(--dim)}
  h4{font-size:12.5px;font-weight:620;color:var(--muted)}

  /* ---------- form ---------- */
  .form{display:grid;gap:11px}
  .field{min-width:0}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  input[type="text"],input[type="number"],input[type="date"],input[type="time"],textarea,select{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--text);font-size:13.5px;outline:none;
    font-family:inherit;transition:border-color .16s,background .16s
  }
  input:focus,textarea:focus,select:focus{border-color:rgba(45,212,191,.55);background:rgba(45,212,191,.05)}
  input::placeholder,textarea::placeholder{color:var(--dim)}
  textarea{resize:vertical;min-height:58px;line-height:1.6}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .err{font-size:11px;color:#fda4af;margin-top:4px;line-height:1.4}
  .err:empty{display:none}
  /* 表单出错时把问题摆在明面上：红框 + 抖动 + 自动滚到出错的字段 */
  .field.is-bad input,.field.is-bad textarea{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.08)}
  .field.is-shake{animation:fieldShake .32s ease}
  @keyframes fieldShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
  /* 买入价表单：操作栏吸底，键盘弹出或内容过长时也能点到「保存」 */
  .hold-form{display:block}
  .sheet-actions.is-sticky{
    position:sticky;bottom:0;z-index:4;
    margin:14px -16px calc(-20px - env(safe-area-inset-bottom));
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(12,19,29,.92),#0c131d 46%);
    border-top:1px solid var(--line-2)
  }
  .hold-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;min-height:20px}
  .link-danger{background:none;border:0;padding:3px 0;font-family:inherit;font-size:11.5px;color:#fda4af;text-decoration:underline;text-underline-offset:3px}
  .hold-ok{font-size:11.5px;color:#7fe9dc}
  .hold-box.is-flash,.rec-card.is-flash{animation:flashRing 1.2s ease}
  @keyframes flashRing{0%{box-shadow:0 0 0 1px rgba(56,189,248,.75),0 0 0 7px rgba(56,189,248,.14)}100%{box-shadow:0 0 0 1px rgba(56,189,248,0),0 0 0 7px rgba(56,189,248,0)}}
  .form-section{margin-top:2px;padding-top:11px;border-top:1px dashed var(--line-2);font-size:11px;color:var(--dim);letter-spacing:.4px}
  .confirm-text{font-size:13px;color:var(--muted);line-height:1.75}


  /* ---------- import ---------- */
  .seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03);margin-bottom:12px}
  .seg-btn{flex:1;padding:7px 8px;border:0;border-radius:8px;background:none;color:var(--muted);font-size:12.5px;font-weight:550;line-height:1.4}
  .seg-btn.is-active{background:var(--accent-soft);color:#7fe9dc;box-shadow:inset 0 0 0 1px rgba(45,212,191,.26)}
  .seg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .import-pane{display:block}
  .src-wrap{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);overflow:hidden}
  .src-text{width:100%;border:0;background:none;border-radius:0;min-height:108px;padding:11px 12px;font-size:12.5px;line-height:1.7;color:var(--text);outline:none;resize:vertical;font-family:inherit}
  .src-text:focus{background:rgba(45,212,191,.04);border:0}
  .src-tools{display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid var(--line-2);background:rgba(255,255,255,.02);flex-wrap:wrap}
  .mini{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;padding:4px 8px;border-radius:7px;white-space:nowrap}
  .mini:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .src-count{margin-left:auto;font-size:10.5px;color:var(--dim)}
  .parse-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:11px 0 8px;font-size:11.5px;color:var(--muted)}
  .parse-meta .pm-ok{color:#5eead4;font-weight:600}
  .parse-meta .pm-warn{color:#fcd34d;font-weight:600}
  .parse-meta .pm-tag{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim)}
  .import-list{display:grid;gap:9px}
  .import-card{border:1px solid var(--line);border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));padding:11px}
  .import-card.is-bad{border-color:rgba(251,191,36,.34)}
  .import-card.is-dup{opacity:.72}
  .ic-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
  .ic-title{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .ic-title strong{font-size:13.5px;font-weight:650}
  .ic-title .ic-code{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .ic-ops{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .ic-badge{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .ic-badge.ok{color:#5eead4;border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.1)}
  .ic-badge.bad{color:#fcd34d;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1)}
  .ic-badge.dup{color:#7dd3fc;border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.1)}
  .ic-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .ic-field{min-width:0}
  .ic-field span{display:block;font-size:10px;color:var(--dim);margin-bottom:3px;letter-spacing:.2px}
  .ic-field input{width:100%;padding:6px 8px;font-size:12.5px;border-radius:8px}
  .ic-issue{margin-top:7px;font-size:10.5px;color:#fcd34d;line-height:1.55}
  .ic-reason{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line-2)}
  .ic-reason b{font-size:10px;color:var(--dim);font-weight:500}
  .ic-reason p{font-size:11px;color:var(--muted);line-height:1.6;margin-top:3px;max-height:78px;overflow:auto}
  .ic-drop{border:1px solid transparent;background:rgba(251,113,133,.08);color:#fda4af;font-size:10.5px;padding:3px 8px;border-radius:999px}
  .import-hint{padding:10px 12px;border:1px dashed var(--line);border-radius:11px;font-size:11.5px;color:var(--muted);line-height:1.75}
  .import-actions{
    position:sticky;bottom:0;z-index:2;margin-top:12px;padding:12px 0 4px;
    background:linear-gradient(180deg,rgba(12,19,29,0),rgba(12,19,29,.99) 22%)
  }
  .import-hint b{color:#cbd5e1;font-weight:600}
  .import-hint code{font-size:10.5px;color:#7fe9dc;background:rgba(45,212,191,.08);padding:1px 4px;border-radius:4px}
  .rec-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .rec-tags span{font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
  .parse-meta .pm-right{margin-left:auto}
  .toast{
    position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
    z-index:90;max-width:min(92vw,460px);padding:10px 14px;border-radius:12px;
    background:rgba(15,22,34,.97);border:1px solid rgba(45,212,191,.35);color:#e9eef7;
    font-size:12.5px;line-height:1.55;box-shadow:0 14px 34px -16px rgba(0,0,0,.9);
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 我的买入 / 比价 ---------- */
  .rec-head-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .more-btn{
    width:26px;height:26px;padding:0;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.035);color:var(--muted);display:grid;place-items:center;
    font-size:15px;line-height:1;letter-spacing:1px
  }
  .more-btn:active{background:rgba(255,255,255,.1)}
  .more-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hold-line{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;padding:7px 9px;
    border:1px solid rgba(56,189,248,.2);border-radius:10px;background:rgba(56,189,248,.07);
    font-size:11.5px;color:var(--muted);min-width:0
  }
  .hold-line .hl-k{color:#7dd3fc;flex:0 0 auto;font-size:10.5px}
  .hold-line .hl-v{font-weight:680;font-size:13px;color:var(--text);flex:0 0 auto}
  .hold-line .hl-d{font-size:10.5px;color:var(--dim);flex:0 0 auto}
  .hold-line .hl-pnl{font-weight:660;font-size:12px;flex:0 0 auto}
  .hold-line .hl-note{
    flex:1 1 100%;font-size:10.5px;color:var(--dim);line-height:1.5;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .hold-line .hl-btn{
    margin-left:auto;flex:0 0 auto;padding:3px 8px;border-radius:7px;font-size:10.5px;font-weight:600;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)
  }
  .hold-line.is-empty{border-style:dashed;border-color:var(--line);background:rgba(255,255,255,.02)}
  .hold-line.is-empty .hl-k{color:var(--dim)}
  .hold-line.is-empty .hl-btn{
    color:#7fe9dc;border-color:rgba(45,212,191,.3);background:rgba(45,212,191,.1)
  }

  .hold-box{
    margin-top:12px;padding:12px 13px;border:1px solid rgba(56,189,248,.24);border-radius:14px;
    background:linear-gradient(180deg,rgba(56,189,248,.1),rgba(56,189,248,.02))
  }
  .hold-box .hb-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hold-box .hb-title{font-size:12px;font-weight:620;color:#bae6fd;display:flex;align-items:center;gap:6px}
  .hold-box .hb-title i{width:6px;height:6px;border-radius:50%;background:#38bdf8;display:inline-block}
  .hold-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  .hold-grid .hg{min-width:0}
  .hold-grid .hg span{display:block;font-size:10px;color:var(--dim)}
  .hold-grid .hg b{
    display:block;font-size:14px;font-weight:660;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .hold-box .hb-foot{
    margin-top:8px;padding-top:8px;border-top:1px dashed rgba(148,163,184,.16);
    font-size:11px;color:var(--muted);line-height:1.6
  }
  .hold-empty{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:6px}

  .cmp{margin-top:10px;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
  .cmp-row{
    display:grid;grid-template-columns:82px minmax(0,1fr);gap:8px;padding:8px 10px;
    background:rgba(255,255,255,.018);font-size:11.5px;border-top:1px solid var(--line-2)
  }
  .cmp-row:first-child{border-top:0}
  .cmp-row .ck{color:var(--dim);font-size:10.5px;padding-top:1px}
  .cmp-row .cv{min-width:0;line-height:1.6}
  .cmp-row .cv b{font-weight:640;font-size:12px}
  .cmp-row .cv em{font-style:normal;color:var(--dim);font-size:10.5px;margin-left:6px}
  .cmp-row .cv .cmp-sub{display:block;color:var(--dim);font-size:10.5px;margin-top:1px}

  .act-list{display:grid;gap:8px;margin-top:4px}
  .act-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;
    border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);font-size:13px
  }
  .act-item .ai-t{min-width:0}
  .act-item .ai-sub{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
  .act-item .ai-arrow{margin-left:auto;color:var(--dim);font-size:12px;flex:0 0 auto}
  .act-item.danger{color:#fda4af;border-color:rgba(251,113,133,.32);background:rgba(251,113,133,.08)}
  .act-item.danger .ai-sub{color:rgba(253,164,175,.7)}
  .act-item:active{transform:scale(.995)}

  .banner .b-act{
    flex:0 0 auto;margin-left:auto;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:600;
    border:1px solid rgba(45,212,191,.4);background:rgba(45,212,191,.16);color:#a7f3e8
  }
  .banner .b-close{margin-left:0}

  /* ---------- desktop ---------- */
  @media (min-width:760px){
    .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
    .hero-next strong{font-size:26px}
    .kv{grid-template-columns:repeat(3,1fr)}
  }
  @media (min-width:960px){
    .app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px;padding:26px 28px 40px;align-items:start}
    .rail{
      display:flex;flex-direction:column;gap:22px;position:sticky;top:26px;
      padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--panel)
    }
    .brand{display:flex;align-items:center;gap:10px}
    .brand-mark{
      width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
      background:linear-gradient(145deg,rgba(45,212,191,.24),rgba(56,189,248,.16));border:1px solid rgba(45,212,191,.35);color:#7fe9dc
    }
    .brand strong{display:block;font-size:14.5px;font-weight:650;letter-spacing:.3px}
    .brand span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
    .rail-nav{display:flex;flex-direction:column;gap:5px}
    .nav-item{
      display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:1px solid transparent;
      background:none;color:var(--muted);font-size:13px;text-align:left;position:relative
    }
    .nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
    .nav-item:hover{background:rgba(255,255,255,.045);color:var(--text)}
    .nav-item.is-active{background:var(--accent-soft);border-color:rgba(45,212,191,.3);color:#7fe9dc}
    .nav-item .badge{margin-left:auto;min-width:17px;height:17px;border-radius:999px;background:#fb7185;color:#3b0713;font-size:10px;font-weight:700;line-height:17px;text-align:center;padding:0 4px}
    .rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2);display:grid;gap:10px}
    .rail-foot .rlabel{font-size:10.5px;color:var(--dim);letter-spacing:.8px}
    .rail-clock{font-size:19px;font-weight:600;letter-spacing:1px;color:#cbd5e1}
    .tabbar{display:none}
    .topbar{position:static;background:none;backdrop-filter:none;padding:0 0 14px;border-bottom:1px solid var(--line-2);margin-bottom:16px}
    .top-left h1{font-size:22px}
    .top-left p{font-size:12px;margin-top:3px}
    .clock-pill{display:none}
    .hero{padding:20px 22px}
    .hero-actions{margin-top:18px}
    .hero-actions .btn{flex:0 0 auto;min-width:150px}
    .sheet-wrap{align-items:center;padding:24px}
    .sheet{max-width:600px;border-radius:18px;max-height:88vh;padding:20px}
    .sheet-actions.is-sticky{margin-left:-20px;margin-right:-20px;margin-bottom:-20px}
    .sheet-wrap.open .sheet{transform:none}
    body{overflow-y:scroll}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .view{animation:none}
  }

  /* ---------- 行情源 / 同步 ---------- */
  .sync-strip{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:0 0 12px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.025);font-size:11.5px;color:var(--muted);line-height:1.5;
  }
  .sync-strip .sdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .sync-strip.err .sdot{background:var(--rose)}
  .sync-strip.busy .sdot{background:var(--amber);animation:pulse 1.2s infinite}
  .sync-strip .se{flex:0 0 auto}
  .sync-strip b{color:var(--text);font-weight:600}
  .sync-strip .sbtn{
    margin-left:auto;padding:5px 10px;font-size:11px;border-radius:8px;line-height:1.2;
    border:1px solid rgba(45,212,191,.32);background:rgba(45,212,191,.1);color:#7fe9dc;font-weight:600;
  }
  .sync-strip .sbtn:disabled{opacity:.5}
  .src-list{display:grid;gap:8px;margin:10px 0 4px}
  .src-opt{
    display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
    padding:10px 11px;border:1px solid var(--line);border-radius:12px;
    background:rgba(255,255,255,.02);transition:border-color .18s,background .18s;
  }
  .src-opt:hover{background:rgba(255,255,255,.045)}
  .src-opt.is-on{border-color:rgba(45,212,191,.45);background:rgba(45,212,191,.075)}
  .src-opt .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--dim);flex:0 0 auto;margin-top:3px;position:relative}
  .src-opt.is-on .radio{border-color:var(--accent)}
  .src-opt.is-on .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}

<script type="text/plain" id="proxySource">
#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""盯盘助手 · 行情数据代理

为「盯盘助手」单页应用提供 A 股日收盘价接口，默认使用 AkShare（免费开源），
也可切换到 Tushare Pro（免费积分）或腾讯公开行情。

启动：
    pip install akshare            # 使用 AkShare 时
    pip install tushare            # 使用 Tushare Pro 时
    python feed_proxy.py --source akshare --port 8787
    python feed_proxy.py --source tushare --token 你的TOKEN --port 8787

接口：
    GET /health
    GET /daily?symbols=603330,300750&days=60

返回：
    {"ok":true,"source":"akshare","data":{"603330":[{"d":"2026-10-29","p":9.68}]},"errors":{}}
"""

import argparse
import json
import os
import sys
import time
import urllib.parse
import urllib.request
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

CACHE_FILE = os.path.join(os.path.dirname(os.path.abspath(__file__)), ".feed_cache.json")
CACHE_TTL = 60 * 30  # 30 分钟内同一代码直接复用，避免频繁请求上游

ARGS = None
CACHE = {}


def load_cache():
    global CACHE
    try:
        with open(CACHE_FILE, "r", encoding="utf-8") as f:
            CACHE = json.load(f)
    except Exception:
        CACHE = {}


def save_cache():
    try:
        with open(CACHE_FILE, "w", encoding="utf-8") as f:
            json.dump(CACHE, f, ensure_ascii=False)
    except Exception:
        pass


def to_symbol(code, kind="ak"):
    code = "".join(ch for ch in str(code) if ch.isdigit())[:6]
    if kind == "ak":
        return code
    if kind == "ts":
        return code + (".SH" if code[0] in "69" else (".BJ" if code[0] in "48" else ".SZ"))
    if code[0] in "69":
        return "sh" + code
    if code[0] in "48":
        return "bj" + code
    return "sz" + code


def rows_from_akshare(code, days):
    import akshare as ak  # 延迟导入，未使用该数据源时不影响启动

    end = time.strftime("%Y%m%d")
    start = time.strftime("%Y%m%d", time.localtime(time.time() - days * 2 * 86400))
    df = ak.stock_zh_a_hist(symbol=to_symbol(code, "ak"), period="daily",
                            start_date=start, end_date=end, adjust="")
    if df is None or len(df) == 0:
        return []
    cols = {c: c for c in df.columns}
    date_col = "日期" if "日期" in cols else df.columns[0]
    close_col = "收盘" if "收盘" in cols else ("close" if "close" in cols else df.columns[2])
    out = []
    for _, row in df.tail(days).iterrows():
        d = str(row[date_col])[:10]
        p = float(row[close_col])
        if p > 0:
            out.append({"d": d, "p": round(p, 2)})
    return out


def rows_from_tushare(code, days):
    import tushare as ts

    pro = ts.pro_api(ARGS.token)
    end = time.strftime("%Y%m%d")
    start = time.strftime("%Y%m%d", time.localtime(time.time() - days * 2 * 86400))
    df = pro.daily(ts_code=to_symbol(code, "ts"), start_date=start, end_date=end)
    if df is None or len(df) == 0:
        return []
    df = df.sort_values("trade_date")
    out = []
    for _, row in df.tail(days).iterrows():
        d = str(row["trade_date"])
        p = float(row["close"])
        if p > 0:
            out.append({"d": d[:4] + "-" + d[4:6] + "-" + d[6:8], "p": round(p, 2)})
    return out


def rows_from_tencent(code, days):
    url = ("https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get"
           "?param=" + to_symbol(code, "tx") + ",day,,,%d," % days)
    req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
    with urllib.request.urlopen(req, timeout=10) as resp:
        payload = json.loads(resp.read().decode("utf-8"))
    node = payload.get("data", {}).get(to_symbol(code, "tx"), {})
    rows = node.get("day") or node.get("qfqday") or []
    out = []
    for r in rows:
        try:
            d, p = r[0], float(r[2])
        except Exception:
            continue
        if p > 0:
            out.append({"d": d, "p": round(p, 2)})
    return out


def fetch(code, days):
    key = "%s:%s:%s" % (ARGS.source, code, days)
    hit = CACHE.get(key)
    if hit and time.time() - hit.get("ts", 0) < CACHE_TTL:
        return hit["rows"]
    if ARGS.source == "tushare":
        rows = rows_from_tushare(code, days)
    elif ARGS.source == "tencent":
        rows = rows_from_tencent(code, days)
    else:
        rows = rows_from_akshare(code, days)
    CACHE[key] = {"ts": time.time(), "rows": rows}
    save_cache()
    return rows


class Handler(BaseHTTPRequestHandler):
    server_version = "StockPulseFeed/1.0"

    def _cors(self):
        self.send_header("Access-Control-Allow-Origin", "*")
        self.send_header("Access-Control-Allow-Methods", "GET, OPTIONS")
        self.send_header("Access-Control-Allow-Headers", "Content-Type")

    def _json(self, obj, status=200):
        body = json.dumps(obj, ensure_ascii=False).encode("utf-8")
        self.send_response(status)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(body)))
        self._cors()
        self.end_headers()
        self.wfile.write(body)

    def do_OPTIONS(self):
        self.send_response(204)
        self._cors()
        self.end_headers()

    def do_GET(self):
        parsed = urllib.parse.urlparse(self.path)
        qs = urllib.parse.parse_qs(parsed.query)
        if parsed.path == "/health":
            return self._json({"ok": True, "source": ARGS.source, "time": int(time.time())})
        if parsed.path != "/daily":
            return self._json({"ok": False, "error": "not found"}, 404)

        raw = (qs.get("symbols") or [""])[0]
        codes = [c for c in raw.replace("，", ",").split(",") if c.strip()][:80]
        try:
            days = max(5, min(250, int((qs.get("days") or ["60"])[0])))
        except Exception:
            days = 60
        if not codes:
            return self._json({"ok": False, "error": "缺少 symbols 参数"}, 400)

        data, errors = {}, {}
        for code in codes:
            code = code.strip()
            try:
                data[code] = fetch(code, days)
                if not data[code]:
                    errors[code] = "无数据（代码可能有误或长期停牌）"
            except Exception as exc:  # 单只失败不影响其它标的
                errors[code] = "%s: %s" % (type(exc).__name__, exc)
        return self._json({"ok": True, "source": ARGS.source, "data": data,
                           "errors": errors, "ts": int(time.time())})

    def log_message(self, fmt, *args):
        sys.stderr.write("[feed] " + fmt % args + "\n")


def main():
    global ARGS
    ap = argparse.ArgumentParser(description="盯盘助手行情代理")
    ap.add_argument("--source", default="akshare", choices=["akshare", "tushare", "tencent"])
    ap.add_argument("--token", default=os.environ.get("TUSHARE_TOKEN", ""))
    ap.add_argument("--port", type=int, default=8787)
    ap.add_argument("--host", default="0.0.0.0")
    ARGS = ap.parse_args()
    if ARGS.source == "tushare" and not ARGS.token:
        print("使用 Tushare 需要 --token 或环境变量 TUSHARE_TOKEN")
        sys.exit(1)
    load_cache()
    print("行情代理已启动：http://127.0.0.1:%d/daily?symbols=603330&days=60" % ARGS.port)
    ThreadingHTTPServer((ARGS.host, ARGS.port), Handler).serve_forever()


if __name__ == "__main__":
    main()
</script>

(function(){

  var STATUS_META = {
    none:{label:'待更新',tone:'muted',hint:'尚未获取到收盘价'},

    sellHigh:{label:'达到最高卖出价',tone:'take',hint:'已到达止盈参考价，可考虑分批卖出'},
    sellLow:{label:'跌破最低卖出价',tone:'stop',hint:'已跌破止损参考价，建议复核持仓'}
  };

  function uid(){ return Math.random().toString(36).slice(2, 10); }
  function pad(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtTime(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function fmtPrice(n){
    var v = Number(n);
    if (!Number.isFinite(v) || v <= 0) return '—';
    return v.toFixed(2);
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function round2(v){ return Math.round(v*100)/100; }
  function todayLabel(ts){ var d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

/* 券商推荐文案解析（纯本地规则，无网络请求） */
var P_ALIAS = {
  code:['股票代码','证券代码','证券编码','代码'],
  name:['股票名称','证券名称','股票简称','名称','简称','标的'],
  buy:['关注价格','关注价','关注区间','建议买入价格','建议买入价','参考买入价','推荐买入价','买入价格','买入价','买入区间','介入区间','介入价格','建仓区间','建仓价','买点'],
  high:['建议最高卖出价','最高卖出价','目标价位','目标价格','目标价','压力价格','压力价','压力位','阻力位','止盈价格','止盈价','止盈位','止盈','第一目标'],
  low:['建议最低卖出价','最低卖出价','支撑价格','支撑价','支撑位','止损价格','止损价','止损位','止损','防守位'],
  pos:['参考仓位','建议仓位','仓位'],
  broker:['证券公司','券商名称','券商','研究机构','机构名称','来源'],
  date:['入选时间','入选日期','推荐日期','发布时间','发布日期','日期'],
  advisor:['投资顾问','投顾','分析师','研究员'],
  license:['执业证书编号','执业编号','证书编号','登记编号']
};

function pEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function pAlt(list){
  return list.slice().sort(function(a,b){ return b.length - a.length; }).map(pEsc).join('|');
}
function pNum(s){
  if (s == null) return NaN;
  var v = Number(String(s).replace(/,/g,''));
  return isFinite(v) && v > 0 ? v : NaN;
}
function pRound(v){ return Math.round(v*100)/100; }

var P_NUM = '(\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|\\d+(?:\\.\\d+)?)';
var P_RANGE_SEP = '\\s*(?:元)?\\s*(?:-|–|—|~|～|至|到|－|－)\\s*';

function pPair(text, aliases){
  var re = new RegExp('(?:' + pAlt(aliases) + ')\\s*[:：]?\\s*(?:约|为|在|人民币|￥|¥)?\\s*' + P_NUM + P_RANGE_SEP + P_NUM + '\\s*(?:元)?', 'i');
  var m = text.match(re);
  if (!m) return null;
  if (/^\s*[%％]/.test(text.slice(m.index + m[0].length))) return null;
  var a = pNum(m[1]), b = pNum(m[2]);
  if (!isFinite(a) || !isFinite(b)) return null;
  return { low:Math.min(a,b), high:Math.max(a,b) };
}

function pOne(text, aliases){
  var re = new RegExp('(?:' + pAlt(aliases) + ')\\s*[:：]?\\s*(?:约|为|在|人民币|￥|¥)?\\s*' + P_NUM + '\\s*(?:元)?', 'i');
  var m = text.match(re);
  if (!m) return NaN;
  if (/^\s*[%％]/.test(text.slice(m.index + m[0].length))) return NaN;
  return pNum(m[1]);
}

function pText(text, aliases, maxLen){
  var re = new RegExp('(?:' + pAlt(aliases) + ')\\s*[:：]?\\s*([^\\n\\r]{1,' + (maxLen || 30) + '})', 'i');
  var m = text.match(re);
  if (!m) return '';
  var v = m[1].replace(/^[\s:：、,，]+/, '').trim();
  v = v.replace(/[\s;；,，。]+$/, '');
  return v;
}

function pDetachDates(t){
  return String(t)
    .replace(/\d{4}\s*[-\/年.]\s*\d{1,2}\s*[-\/月.]\s*\d{1,2}\s*日?/g, ' ')
    .replace(/\d{1,2}\s*月\s*\d{1,2}\s*日?/g, ' ')
    .replace(/(?:入选时间|入选日期|推荐日期|发布时间|发布日期|日期|时间)\s*[:：]?\s*\d{1,2}\s*[-\/.]\s*\d{1,2}\s*日?/g, ' ');
}

function pDate(text, fallbackYear){
  var now = new Date();
  var y = fallbackYear || now.getFullYear();
  var m = text.match(/(?:入选时间|入选日期|推荐日期|发布时间|发布日期|日期|时间)\s*[:：]?\s*(?:(\d{4})\s*[年\-\/.]\s*)?(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})\s*日?/);
  if (!m) m = text.match(/(?:(\d{4})\s*[年\-\/.]\s*)?(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})\s*日/);
  if (!m) m = text.match(/(\d{4})\s*[年\-\/.]\s*(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})/);
  if (!m) return '';
  var yy, mm, dd;
  if (m.length === 4){ yy = m[1] ? Number(m[1]) : y; mm = Number(m[2]); dd = Number(m[3]); }
  else return '';
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return '';
  var d = new Date(yy, mm-1, dd);
  if (d.getMonth() !== mm-1) return '';
  // 未写年份且日期明显在未来（如跨年），回退一年
  if (!m[1] && d.getTime() > now.getTime() + 45*86400000) d.setFullYear(d.getFullYear() - 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function pCodes(text){
  var out = [], re = /(\d{6})/g, m;
  while ((m = re.exec(text))){
    var i = m.index;
    var before = i > 0 ? text.charAt(i-1) : '';
    var after = text.charAt(i+6);
    if (/[A-Za-z0-9]/.test(before) || /[A-Za-z0-9]/.test(after)) continue;
    if (!/^[0-9]/.test(m[1])) continue;
    out.push({ code:m[1], index:i });
  }
  return out;
}

function pSource(text){
  var m = text.match(/【([^】\n]{1,20})】/);
  return m ? m[1].trim() : '';
}

function pReason(text){
  var re = /(?:入选理由|推荐理由|核心逻辑|投资逻辑|看好理由|推荐逻辑|核心观点)\s*[:：]\s*([\s\S]*?)(?=\n\s*(?:【|风险提示|免责|投资顾问|执业编号|执业证书编号)|$)/;
  var m = text.match(re);
  if (!m) return '';
  return m[1].replace(/\s*\n\s*/g, ' ').replace(/\s{2,}/g, ' ').trim().slice(0, 300);
}

function pBroker(text, known){
  for (var i = 0; i < known.length; i++){
    if (known[i] && text.indexOf(known[i]) >= 0) return known[i];
  }
  var m = text.match(/([\u4e00-\u9fa5]{2,10}证券(?:股份有限公司|有限责任公司|有限公司)?)/);
  if (m) return m[1];
  return '';
}

function pAdvisor(text){
  var name = '', lic = '';
  var m = text.match(/(?:投资顾问|投顾|分析师|研究员)\s*[:：]?\s*([\u4e00-\u9fa5]{2,4})/);
  if (m) name = m[1];
  var l = text.match(/(?:执业证书编号|执业编号|证书编号|登记编号)\s*[:：]?\s*([A-Za-z0-9]{6,20})/);
  if (l) lic = l[1];
  return { name:name, license:lic };
}

var P_CN_NUM = {'一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10','半':'0.5'};
function pPosition(text){
  var m = text.match(/(?:参考仓位|建议仓位|仓位)\s*[:：]?\s*([0-9一二两三四五六七八九十半]+(?:\.[0-9]+)?\s*[成层%％]\s*仓?)/);
  if (!m) return '';
  var v = m[1].replace(/\s+/g, '');
  v = v.replace(/^([0-9一二两三四五六七八九十半]+)/, function(x){ return P_CN_NUM[x] || x; });
  return v;
}

function pLineStart(t, idx){ var p = t.lastIndexOf('\n', idx); return p < 0 ? 0 : p + 1; }

var P_SKIP_TITLE = /风险提示|免责|声明|重要提示|特别提示|免责条款/;

function pBlocks(text){
  var t = String(text || '').replace(/\r\n?/g, '\n').trim();
  if (!t) return [];
  var titles = [], re = /【([^】\n]{1,20})】/g, m;
  while ((m = re.exec(t))) titles.push({ index:m.index, title:m[1] });
  var blocks = [];

  if (titles.length){
    for (var i = 0; i < titles.length; i++){
      var start = i === 0 ? 0 : pLineStart(t, titles[i].index);
      var end = (i === titles.length - 1) ? t.length : pLineStart(t, titles[i + 1].index);
      if (P_SKIP_TITLE.test(titles[i].title)) continue;
      var sub = t.slice(start, end);
      var codes = pCodes(sub).filter(function(c, idx, arr){
        // 同一只股票在紧邻位置重复出现（如名称后括号内的代码）不重复切块
        for (var q = idx - 1; q >= 0; q--){
          if (c.index - arr[q].index > 320) break;
          if (arr[q].code === c.code) return false;
        }
        return true;
      });
      if (!codes.length) continue;
      for (var k = 0; k < codes.length; k++){
        var st = k === 0 ? 0 : pLineStart(sub, codes[k].index);
        var en = (k === codes.length - 1) ? sub.length : pLineStart(sub, codes[k + 1].index);
        blocks.push({ text: sub.slice(st, en), code: codes[k].code, index: start + st, title: titles[i].title });
      }
    }
  }

  if (!blocks.length){
    var all = pCodes(t);
    if (!all.length) return [{ text:t, code:'', index:0 }];
    for (var j = 0; j < all.length; j++){
      var s2 = j === 0 ? 0 : pLineStart(t, all[j].index);
      var e2 = (j === all.length - 1) ? t.length : pLineStart(t, all[j + 1].index);
      blocks.push({ text: t.slice(s2, e2), code: all[j].code, index: s2 });
    }
  }

  blocks.sort(function(a, b){ return a.index - b.index; });
  // 去掉“栏目名出现在正文里”造成的重复块
  var seen = {};
  return blocks.filter(function(b){
    var key = (b.code || '') + '|' + b.text.slice(0, 40);
    if (seen[key]) return false;
    seen[key] = true;
    return true;
  });
}

function pParseBlock(block, ctx){
  var text = block.text || '';
  var code = block.code || '';
  if (!code){
    var cm = text.match(/(?:股票代码|证券代码|代码)\s*[:：]?\s*(\d{6})/);
    if (cm) code = cm[1];
    else { var cs = pCodes(text); if (cs.length) code = cs[0].code; }
  }
  if (!code) return null;
  var source = pSource(text) || block.title || ctx.source || '';
  var name = pText(text, P_ALIAS.name, 16);
  if (name){ name = name.split(/[\s（(]/)[0]; }
  if (!name && code){
    var nm = text.match(new RegExp(code + '\\s*[：: ]?\\s*([A-Za-z*]*[\u4e00-\u9fa5]{2,8})'));
    if (nm) name = nm[1];
  }
  if (name && /^\d/.test(name)) name = '';

  var pair = pPair(text, P_ALIAS.buy);
  if (!pair){
    var clean = pDetachDates(text);
    var gm = clean.match(/(\d+(?:\.\d+)?)\s*(?:元)?\s*(?:-|–|—|~|～|至|到|－)\s*(\d+(?:\.\d+)?)\s*(?:元)?/);
    if (gm && isFinite(pNum(gm[1])) && isFinite(pNum(gm[2]))){
      pair = { low:Math.min(pNum(gm[1]), pNum(gm[2])), high:Math.max(pNum(gm[1]), pNum(gm[2])) };
    }
  }
  var buySingle = NaN;
  if (!pair){ buySingle = pOne(text, P_ALIAS.buy); }

  var high = pOne(text, P_ALIAS.high);
  var low = pOne(text, P_ALIAS.low);
  var pos = pPosition(text) || (ctx.single ? ctx.position : '') || '';
  var date = pDate(text) || (ctx.single ? ctx.date : '') || '';
  var broker = pBroker(text, ctx.known) || block.title || (ctx.single ? ctx.broker : '') || '';
  var adv = pAdvisor(text);
  var reason = pReason(text);

  var item = {
    code: code || '',
    name: name || '',
    broker: broker || '',
    date: date || '',
    buyLow: pair ? pRound(pair.low) : (isFinite(buySingle) ? pRound(buySingle) : NaN),
    buyHigh: pair ? pRound(pair.high) : (isFinite(buySingle) ? pRound(buySingle) : NaN),
    sellHigh: isFinite(high) ? pRound(high) : NaN,
    sellLow: isFinite(low) ? pRound(low) : NaN,
    position: pos,
    advisor: adv.name || (ctx.single ? ctx.advisor : '') || '',
    license: adv.license || (ctx.single ? ctx.license : '') || '',
    source: source,
    reason: reason || '',
    raw: text
  };
  if (!item.broker){
    item.broker = item.source || '券商推荐';
  }
  return item;
}

function pValidate(item, existingCodes){
  var issues = [];
  if (!/^\d{6}$/.test(String(item.code || ''))) issues.push('股票代码需为 6 位数字');
  if (!item.name) issues.push('缺少股票名称');
  if (!isFinite(item.buyLow) || !isFinite(item.buyHigh)) issues.push('缺少关注价格');
  if (!isFinite(item.sellHigh)) issues.push('缺少压力价 / 最高卖出价');
  if (!isFinite(item.sellLow)) issues.push('缺少支撑价 / 最低卖出价');
  if (isFinite(item.buyLow) && isFinite(item.buyHigh) && item.buyLow > item.buyHigh) issues.push('买入下限高于上限');
  if (isFinite(item.sellHigh) && isFinite(item.buyHigh) && item.sellHigh <= item.buyHigh && isFinite(item.buyHigh)) issues.push('最高卖出价应高于买入上限');
  if (isFinite(item.sellLow) && isFinite(item.buyLow) && item.sellLow >= item.buyLow && isFinite(item.buyLow)) issues.push('最低卖出价应低于买入下限');
  if (isFinite(item.buyHigh) && isFinite(item.buyLow) && isFinite(item.sellHigh) && isFinite(item.sellLow) && !(item.sellLow < item.buyLow && item.buyHigh < item.sellHigh)){
    // 区间交叉，去重提示
  }
  var dup = false;
  if (existingCodes && /^\d{6}$/.test(String(item.code || '')) && existingCodes.indexOf(item.code) >= 0) dup = true;
  return { issues:issues, dup:dup, ok:(!dup && !issues.length) };
}

function pParse(text, opts){
  opts = opts || {};
  var known = opts.known || [];
  var existing = opts.existing || [];
  var clean = String(text || '').replace(/(?:SH|SZ|BJ)\s*[:：]?\s*(\d{6})/gi, ' $1');
  var blocks = pBlocks(clean);
  text = clean;
  var full = String(text || '').replace(/\r\n?/g, '\n');
  var ctx = {
    known: known,
    source: pSource(full),
    date: pDate(full),
    position: pPosition(full),
    broker: pBroker(full, known),
    advisor: pAdvisor(full).name,
    license: pAdvisor(full).license,
    single: blocks.length === 1
  };
  var items = blocks.map(function(b){ return pParseBlock(b, ctx); }).filter(Boolean);
  // 投顾信息常写在文末公共免责段：仅当所有条目都没识别到时才统一回填，避免串到别的股票
  var hasAdv = items.some(function(i){ return i.advisor; });
  if (!hasAdv && ctx.advisor){
    items.forEach(function(i){ i.advisor = ctx.advisor; i.license = i.license || ctx.license || ''; });
  }
  var seen = {};
  items.forEach(function(it){
    var v = pValidate(it, existing);
    if (seen[it.code]){ v.issues.push('原文中重复出现，确认时只录第一条'); v.dup = true; v.ok = false; }
    seen[it.code] = true;
    it.issues = v.issues;
    it.dup = v.dup;
    it.ok = v.ok;
  });
  return { items:items, context:ctx };
}

  function lastTradeDayKey(){

  }
  function closeList(rec){
    var arr = Array.isArray(rec.closes) ? rec.closes.slice() : [];

  /* ---- 补齐范围：只补「入选时间」当日及之后的交易日，已有的日期跳过 ---- */
  function parseDayKey(k){
    var p = String(k || '').split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function spanDays(a, b){
    return Math.round((parseDayKey(b).getTime() - parseDayKey(a).getTime()) / 86400000);
  }
  // 补齐起点 = 推荐日期（含）
  function recStartKey(rec){
    var raw = String((rec && rec.dateLabel) || '').trim();

    if (m){
      var d1 = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      if (d1.getMonth() === Number(m[2]) - 1 && d1.getDate() === Number(m[3])) return dateKey(d1);
    }
    m = raw.match(/^(\d{1,2})\s*[-\/月.]\s*(\d{1,2})\s*日?$/);
    if (m){
      var now = new Date(), mm = Number(m[1]), dd = Number(m[2]);
      if (mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31){
        var d2 = new Date(now.getFullYear(), mm - 1, dd);
        if (d2.getMonth() === mm - 1 && d2.getDate() === dd){
          if (d2.getTime() > now.getTime() + 45 * 86400000) d2.setFullYear(d2.getFullYear() - 1);
          return dateKey(d2);
        }
      }

  // 已到收盘时间的最近一个交易日

  function backfillFloor(){

    return dateKey(d);
  }
  // 「推荐日 → 最近收盘日」区间内仍缺收盘价的交易日
  function missingDates(rec){

    if (start < floorKey) start = floorKey;

  /* ---- 我的真实买入价（持仓成本）---- */
  function isDayKey(k){ return /^\d{4}-\d{2}-\d{2}$/.test(String(k || '')); }

  function ageText(ts){

  function getJson(url, ms){
    if (typeof fetch !== 'function') return Promise.reject(new Error('当前浏览器不支持网络请求'));
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl){ try{ ctrl.abort(); }catch(e){} } }, ms || 12000);
    var opt = { method:'GET', cache:'no-store' };
    if (ctrl) opt.signal = ctrl.signal;
    return fetch(url, opt).then(function(res){
      clearTimeout(timer);
      if (!res.ok) throw new Error('接口返回 HTTP ' + res.status);
      return res.text();
    }, function(err){
      clearTimeout(timer);
      throw new Error(err && err.name === 'AbortError' ? '请求超时，请检查网络或代理是否运行' : '网络请求被拦截或接口不可达');
    }).then(function(txt){
      try{ return JSON.parse(txt); }

    });
  }

  function txSymbol(code){
    var c = String(code || '').replace(/\D/g, '').slice(0, 6);

    return 'sz' + c;
  }

  function txDaily(code, days){
    var sym = txSymbol(code);
    var url = 'https://proxy.finance.qq.com/ifzqgtimg/appstock/app/newfqkline/get?param='
      + sym + ',day,,,' + days + ',&_=' + Date.now();
    return getJson(url, 12000).then(function(res){
      var node = res && res.data && res.data[sym];
      if (!node) throw new Error('未找到该代码的行情');
      var rows = node.day || node.qfqday || [];
      var out = [];
      rows.forEach(function(r){
        var d = r && r[0], c = r && Number(r[2]);
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(d)) && Number.isFinite(c) && c > 0){

    });
  }

  function proxyDaily(codes, days, f){
    var base = String(f.proxyUrl || '').trim().replace(/\/+$/, '');

    var url = base + '/daily?symbols=' + encodeURIComponent(codes.join(',')) + '&days=' + days;
    if (f.token) url += '&token=' + encodeURIComponent(f.token);
    return getJson(url, 20000).then(function(res){
      if (!res || res.ok !== true) throw new Error((res && res.error) || '代理返回异常');
      var map = {};
      Object.keys(res.data || {}).forEach(function(code){
        var rows = res.data[code] || [];
        var pts = [];
        rows.forEach(function(x){
          var p = Number(x && x.p);
          if (x && /^\d{4}-\d{2}-\d{2}$/.test(String(x.d)) && Number.isFinite(p) && p > 0) pts.push({ d:x.d, p:round2(p) });
        });

      });
      if (!Object.keys(map).length) throw new Error('代理没有返回任何收盘价，请检查代码或数据源配置');

  }

  function demoSeries(code, days, base){
    var seed = 7;
    String(code).split('').forEach(function(ch){ seed = (seed * 31 + ch.charCodeAt(0)) % 233280; });
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var dates = [], cur = new Date();
    cur.setHours(0,0,0,0);
    while (dates.length < days){
      if (isTradeDay(cur)) dates.push(dateKey(cur));
      cur.setDate(cur.getDate() - 1);
    }
    dates.reverse();
    var p = (base || 10) * (1 + (rnd() - .5) * .1), out = [];
    dates.forEach(function(d){
      p = Math.max(0.4, p * (1 + (rnd() - .5) * 0.028));
      out.push({ d:d, p:round2(p) });
    });
    return out;
  }

  // jobs: [{ code, days, rec }]，每只标的按自己的缺口区间取数
  function fetchCloses(jobs, onProgress){
    var f = feedConfig();

    if (!list.length) return Promise.resolve({ map:{}, errors:{}, feedKind:f.mode });

      var dmap = {};

        var rec = j.rec || null;
        var base = rec && Number.isFinite(rec.buyLow) && Number.isFinite(rec.buyHigh) ? (rec.buyLow + rec.buyHigh) / 2 : 12;
        dmap[j.code] = demoSeries(j.code, j.days || 30, base);
      });
      if (onProgress) onProgress(list.length);
      return Promise.resolve({ map:dmap, errors:{}, feedKind:'demo' });
    }
    var kind = f.mode === 'proxy' ? 'proxy' : 'tencent';
    var limit = kind === 'proxy' ? 2 : 3;
    var map = {}, errors = {}, idx = 0, active = 0, done = 0;
    return new Promise(function(resolve){
      function next(){
        while (active < limit && idx < list.length){

  // 收盘价只在 15:00 之后才算最终收盘，盘中数据不落库
  function finalizePoints(pts){
    var now = new Date();

    var closed = (now.getHours() * 60 + now.getMinutes()) >= 15 * 60;
    var seen = {};
    var out = [];
    (pts || []).forEach(function(x){
      if (!x || !x.d || !Number.isFinite(x.p)) return;
      if (x.d > today) return;
      if (x.d === today && !closed) return;
      if (seen[x.d]) return;
      seen[x.d] = 1;
      out.push({ d:x.d, p:round2(x.p) });
    });
    out.sort(function(a,b){ return a.d < b.d ? -1 : (a.d > b.d ? 1 : 0); });
    return out;
  }

  // 只写入「推荐日之后 + 尚未记录」的日期：已有收盘价的日期直接跳过，返回新增条数
  function mergeCloses(rec, pts, feedKind, startKey){
    var map = {}, added = 0;

      map[x.d] = { d:x.d, p:round2(x.p), src:src };
      added++;
    });
    var arr = Object.keys(map).sort().map(function(k){ return map[k]; }).slice(-300);

    var last = arr[arr.length - 1];
    if (last){
      rec.lastPrice = last.p;
      rec.priceDate = last.d;

      f.lastSyncAt = Date.now();
      f.lastSyncOk = false;
      f.lastSyncAdded = 0;
      f.lastSyncMsg = msg;
      plans.forEach(function(p){
        p.rec.feedState = 'error';
        p.rec.feedMsg = msg;
      });
      state.logs.unshift({
        id:uid(), ts:Date.now(), source:reason, label:syncLabel(reason),
        total:total, ok:0, fail:plans.length, added:0, skipped:skipped, alerts:0,
        feed:f.mode, feedName:FEED_META[f.mode].name, ms:Date.now() - t0
      });
      state.logs = state.logs.slice(0, 40);
      ui.banner = { source:'sync-error', ts:Date.now(), msg:msg, total:total, feedName:FEED_META[f.mode].name };
      save();
      renderCurrent();
      if (!opts.silent) showToast('同步失败：' + msg);
      return null;
    });
  }

  function syncOne(code, opts){
    opts = opts || {};
    var rec = state.recs.find(function(r){ return r.code === code; });
    if (!rec) return Promise.resolve(null);
    var f = feedConfig();
    var plan = planRec(rec);
    if (!plan.need){
      rec.feedState = (rec.closes && rec.closes.length) ? 'ok' : 'pending';
      rec.feedMsg = '';
      save();
      renderCurrent();
      if (!opts.silent) showToast(plan.pending ? '推荐日尚未收盘，15:00 后再补齐' : '已补齐至最新，无需重复拉取');
      return Promise.resolve({ added:0, skipped:true });
    }
    rec.feedState = 'loading';
    return fetchCloses([plan]).then(function(res){
      var pts = res.map[code];
      if (!pts || !pts.length) throw new Error((res.errors && res.errors[code]) || '未取得该股收盘价');
      var clean = finalizePoints(pts);
      if (!clean.length) throw new Error('尚未到收盘时间，暂无可用收盘价');
      var n = mergeCloses(rec, clean, res.feedKind, plan.start);
      var st = statusOf(rec), prevKey = rec.lastStatusKey;
      var pushed = false;
      if (prevKey && prevKey !== 'none' && prevKey !== st.key) pushed = addPush(rec, st, 'manual');
      rec.lastStatusKey = st.key;
      rec.feedState = 'ok';
      rec.feedMsg = '';
      f.lastSyncAt = Date.now();
      f.lastSyncOk = true;
      save();
      renderCurrent();
      if (!opts.silent){
        if (!n) showToast('该标的区间内数据已齐全，本次未写入新记录');
        else showToast(pushed ? ('已补齐 ' + n + ' 个交易日，并提出新的区间提示') : ('已补齐 ' + n + ' 个交易日收盘价'));
      }
      return { added:n, skipped:!n };
    }).catch(function(err){
      rec.feedState = 'error';
      rec.feedMsg = (err && err.message) || '取数失败';
      save();
      renderCurrent();
      if (!opts.silent) showToast('取数失败：' + rec.feedMsg);
      return null;
    });
  }

  function testFeed(){
    var f = feedConfig();
    var t0 = Date.now();
    return fetchCloses([{ code:'600519', days:10 }]).then(function(res){
      var pts = res.map['600519'] || [];
      if (!pts.length) throw new Error('连接成功但未返回样例数据');
      var last = pts[pts.length - 1];
      return { ms:Date.now() - t0, last:last, count:pts.length };
    });
  }

  /* ============ 业务规则 ============ */
  function statusOf(rec){
    var p = rec.lastPrice;
    if (!Number.isFinite(p) || p <= 0) return { key:'none', label:STATUS_META.none.label, tone:'muted', hint:STATUS_META.none.hint };
    if (p <= rec.sellLow) return { key:'sellLow', label:STATUS_META.sellLow.label, tone:'stop', hint:STATUS_META.sellLow.hint };
    if (p >= rec.sellHigh) return { key:'sellHigh', label:STATUS_META.sellHigh.label, tone:'take', hint:STATUS_META.sellHigh.hint };
    if (p < rec.buyLow) return { key:'below', label:STATUS_META.below.label, tone:'op', hint:STATUS_META.below.hint };
    if (p <= rec.buyHigh) return { key:'inbuy', label:STATUS_META.inbuy.label, tone:'ok', hint:STATUS_META.inbuy.hint };
    return { key:'above', label:STATUS_META.above.label, tone:'warn', hint:STATUS_META.above.hint };
  }

  function deviation(rec){
    var base = (rec.buyLow + rec.buyHigh)/2;
    if (!base || !Number.isFinite(rec.lastPrice)) return { text:'—', cls:'flat', pct:0 };
    var pct = (rec.lastPrice - base)/base*100;
    var sign = pct > 0 ? '+' : '';
    return { text: sign + pct.toFixed(2) + '%', cls: pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat'), pct: pct };
  }

  function makeAlert(rec, st){
    var dev = deviation(rec);
    var head;
    if (st.key === 'sellHigh') head = '收盘价达到最高卖出价，可考虑分批止盈';
    else if (st.key === 'sellLow') head = '收盘价跌破最低卖出价，注意风控复核';
    else if (st.key === 'below') head = '收盘价低于买入区间下限，进入关注窗口';
    else if (st.key === 'inbuy') head = '收盘价进入推荐买入区间';
    else if (st.key === 'above') head = '收盘价高于买入区间上限，注意追高风险';
    else head = '收盘价状态更新';
    var body = head + '。' + (rec.priceDate || '') + ' 收盘 ' + fmtPrice(rec.lastPrice)
      + '（较买入中值 ' + dev.text + '）；买入 '
      + fmtPrice(rec.buyLow) + '–' + fmtPrice(rec.buyHigh) + '，止盈 ' + fmtPrice(rec.sellHigh)
      + '，止损 ' + fmtPrice(rec.sellLow) + '。';
    return { title: rec.name + ' ' + rec.code + ' · 收盘价' + st.label, body: body };
  }

  function notifySystem(title, body){
    if (!state.settings.notify) return;
    if (typeof Notification === 'undefined') return;
    if (Notification.permission !== 'granted') return;
    try{ new Notification(title, { body: body, tag: 'stockpulse-' + Date.now() }); }
    catch(e){ console.warn('系统通知发送失败', e); }
  }

  function addPush(rec, st, source){
    var last = state.pushes[0];
    // 同一标的、同一状态在 5 分钟内只推一次，避免手动改价后紧接着的定时检查重复提醒
    if (last && last.code === rec.code && last.statusKey === st.key && (Date.now() - last.ts) < 300000) return false;
    var a = makeAlert(rec, st);
    state.pushes.unshift({
      id: uid(), ts: Date.now(), code: rec.code, name: rec.name,
      price: rec.lastPrice, statusKey: st.key, tone: st.tone,
      title: a.title, body: a.body, read: false, source: source
    });
    state.pushes = state.pushes.slice(0, 200);
    notifySystem(a.title, a.body);
    return true;
  }

  // 保留原调用名：所有「检查」动作都改为真实拉取收盘价
  function runCheck(opts){
    opts = opts || {};
    return syncAll({ reason: opts.source || 'manual', silent: !!opts.silent });
  }

  /* ============ 定时计划 ============ */
  function nextRun(){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var best = null;
    state.settings.schedules.filter(function(s){ return s.enabled; }).forEach(function(s){
      var p = s.time.split(':'), mins = Number(p[0])*60 + Number(p[1]);
      var offset = mins > nowMin ? 0 : 1;
      var ts = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset, Number(p[0]), Number(p[1]), 0, 0).getTime();
      if (!best || ts < best.ts) best = { ts:ts, time:s.time, label:s.label, offset:offset };
    });
    return best;
  }
  function countdownText(ts){
    var diff = Math.max(0, ts - Date.now());
    var mins = Math.floor(diff/60000);
    if (mins < 1) return '不到 1 分钟后执行';
    if (mins < 60) return '约 ' + mins + ' 分钟后执行';
    var h = Math.floor(mins/60), m = mins%60;
    return '约 ' + h + ' 小时' + (m ? ' ' + m + ' 分钟' : '') + '后执行';
  }

  function evaluateSchedules(){
    if (!state) return;
    var now = new Date();
    var dk = dateKey(now);
    var nowMin = now.getHours()*60 + now.getMinutes();
    var changed = false;
    state.settings.schedules.forEach(function(s){
      if (!s.enabled) return;
      var p = s.time.split(':'), mins = Number(p[0])*60 + Number(p[1]);
      var key = dk + '#' + s.time;
      if (s.lastRunKey === key) return;
      if (nowMin >= mins){
        s.lastRunKey = key;
        changed = true;
        runCheck({ source: nowMin - mins > 3 ? 'catchup' : 'auto', label: s.label });
      }
    });
    if (changed) save();
  }

  function tickClock(){
    var now = new Date();
    var t = pad(now.getHours())+':'+pad(now.getMinutes());
    var full = t + ':' + pad(now.getSeconds());
    if (els.topClock) els.topClock.textContent = t;
    if (els.railClock) els.railClock.textContent = full;
    evaluateSchedules();
  }

  /* ============ 渲染小件 ============ */
  function pill(st){ return '<span class="pill tone-' + st.tone + '">' + esc(st.label) + '</span>'; }

  function closeChart(rec){
    var pts = closeList(rec).slice(-30);
    if (pts.length < 2) return '<div class="chart-empty">收盘记录不足两天，更新后再看走势。</div>';
    var W = 340, H = 150, L = 40, R = 12, T = 16, B = 24;
    var vals = pts.map(function(p){ return p.p; });
    var myHold = holdOf(rec);
    if (myHold) vals = vals.concat([myHold.price]);
    var lo0 = Math.min.apply(null, vals), hi0 = Math.max.apply(null, vals);
    lo0 = Math.min(lo0, rec.buyLow); hi0 = Math.max(hi0, rec.buyHigh);
    var span = hi0 - lo0;
    var pad = span > 0 ? span * 0.16 : Math.max(hi0 * 0.03, 0.5);
    var lo = lo0 - pad, hi = hi0 + pad;
    var plotW = W - L - R, plotH = H - T - B;
    function X(i){ return L + (pts.length === 1 ? plotW/2 : (i/(pts.length-1)) * plotW); }
    function Y(v){ return T + (1 - (clamp(v, lo, hi) - lo)/(hi - lo)) * plotH; }
    var dLine = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p.p).toFixed(1); }).join(' ');
    var baseY = (T + plotH).toFixed(1);
    var dArea = dLine + ' L' + X(pts.length-1).toFixed(1) + ',' + baseY + ' L' + X(0).toFixed(1) + ',' + baseY + ' Z';
    var bandTop = Y(rec.buyHigh), bandBot = Y(rec.buyLow);
    var lastX = X(pts.length-1), lastY = Y(pts[pts.length-1].p);
    var labelY = Math.max(lastY - 9, T + 8);
    var grid = [hi, (hi + lo)/2, lo].map(function(v){
      var gy = Y(v).toFixed(1);
      return '<line x1="' + L + '" y1="' + gy + '" x2="' + (W-R) + '" y2="' + gy + '" stroke="rgba(148,163,184,.14)" stroke-width="1"/>'
        + '<text x="' + (L-6) + '" y="' + (Number(gy)+3.4).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="#5d6a7e">' + fmtPrice(v) + '</text>';
    }).join('');
    var gid = 'cg-' + String(rec.code).replace(/[^0-9A-Za-z_-]/g, '');
    var aria = '近' + pts.length + '个交易日收盘价走势，最新收盘 ' + fmtPrice(rec.lastPrice);
    return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + aria + '">'
      + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      +   '<stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.30"/>'
      +   '<stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>'
      + '</linearGradient></defs>'
      + grid
      + '<rect x="' + L + '" y="' + bandTop.toFixed(1) + '" width="' + plotW + '" height="' + Math.max(bandBot - bandTop, 1).toFixed(1) + '" fill="rgba(45,212,191,.14)"/>'
      + '<line x1="' + L + '" y1="' + bandTop.toFixed(1) + '" x2="' + (W-R) + '" y2="' + bandTop.toFixed(1) + '" stroke="rgba(45,212,191,.42)" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<line x1="' + L + '" y1="' + bandBot.toFixed(1) + '" x2="' + (W-R) + '" y2="' + bandBot.toFixed(1) + '" stroke="rgba(45,212,191,.42)" stroke-width="1" stroke-dasharray="3 3"/>'
      + (myHold ? ('<line x1="' + L + '" y1="' + Y(myHold.price).toFixed(1) + '" x2="' + (W-R) + '" y2="' + Y(myHold.price).toFixed(1) + '" stroke="rgba(56,189,248,.72)" stroke-width="1.2" stroke-dasharray="5 3"/>'
        + '<text x="' + (W-R-2) + '" y="' + (Y(myHold.price)-4).toFixed(1) + '" text-anchor="end" font-size="9" fill="#7dd3fc">我的买入 ' + fmtPrice(myHold.price) + '</text>') : '')
      + '<path d="' + dArea + '" fill="url(#' + gid + ')"/>'
      + '<path d="' + dLine + '" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      + '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="6.5" fill="rgba(45,212,191,.18)"/>'
      + '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="3.2" fill="#2dd4bf"/>'
      + '<rect x="' + (lastX - 53).toFixed(1) + '" y="' + (labelY - 9.5).toFixed(1) + '" width="47" height="13.5" rx="3.5" fill="rgba(7,10,16,.72)"/>'
      + '<text x="' + (lastX - 7).toFixed(1) + '" y="' + labelY.toFixed(1) + '" text-anchor="end" font-size="10" font-weight="600" fill="#7fe9dc">' + fmtPrice(rec.lastPrice) + '</text>'
      + '<text x="' + L + '" y="' + (H-6) + '" font-size="9.5" fill="#5d6a7e">' + fmtMD(pts[0].d) + '</text>'
      + '<text x="' + (W-R) + '" y="' + (H-6) + '" text-anchor="end" font-size="9.5" fill="#5d6a7e">' + fmtMD(pts[pts.length-1].d) + '</text>'
      + '</svg>';
  }

  function priceBar(rec){
    var vals = [rec.buyLow, rec.buyHigh, rec.sellLow, rec.sellHigh, rec.lastPrice].filter(Number.isFinite);
    if (!vals.length) return '';
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var padV = (max - min) * 0.18 || Math.max(max * 0.02, 1);
    var lo = min - padV, hi = max + padV;
    var pc = function(v){ return clamp((v - lo)/(hi - lo) * 100, 0, 100); };
    var bl = pc(rec.buyLow), bh = pc(rec.buyHigh), sl = pc(rec.sellLow), sh = pc(rec.sellHigh), mp = pc(rec.lastPrice);
    var edge = mp > 70 ? ' edge-r' : (mp < 30 ? ' edge-l' : '');
    var label = '价格区间示意，收盘价 ' + fmtPrice(rec.lastPrice) + '，买入区间 ' + fmtPrice(rec.buyLow) + ' 至 ' + fmtPrice(rec.buyHigh);
    return '<div class="pbar" role="img" aria-label="' + label + '">'
      + '<div class="pbar-track">'
      +   '<div class="band band-sell" style="left:' + sl.toFixed(2) + '%;width:' + Math.max(sh - sl, 0.6).toFixed(2) + '%"></div>'
      +   '<div class="band band-buy" style="left:' + bl.toFixed(2) + '%;width:' + Math.max(bh - bl, 0.6).toFixed(2) + '%"></div>'
      +   '<div class="pbar-marker' + edge + '" style="left:' + mp.toFixed(2) + '%"><span class="chip">' + fmtPrice(rec.lastPrice) + '</span></div>'
      + '</div>'
      + '<div class="pbar-scale"><span>' + fmtPrice(lo) + '</span><span>' + fmtPrice(hi) + '</span></div>'
      + '</div>';
  }

  function bannerHtml(){
    if (!ui.banner) return '';
    var b = ui.banner;
    var text;
    if (b.source === 'storage') text = b.note;
    else if (b.source === 'sync'){
      text = fmtTime(b.ts) + ' ' + syncLabel(b.reason) + '完成（' + esc(b.feedName) + '）：成功 ' + b.ok + '/' + b.total + ' 只'
        + (b.fail ? ('，失败 ' + b.fail + ' 只') : '')
        + (b.skipped ? ('，已补齐跳过 ' + b.skipped + ' 只') : '')
        + (b.added ? ('，新增 ' + b.added + ' 个收盘价') : '，无新收盘价')

      text = fmtTime(b.ts) + ' 同步失败：' + esc(b.msg) + '。可在「计划与设置 → 行情数据源」检查配置后重试。';

  function renderWatchList(){
    var list = els.watch.querySelector('#watchList');
    if (!list) return;
    var strip = els.watch.querySelector('#watchSync');
    if (strip) strip.innerHTML = syncStripHtml();
    var q = ui.search.toLowerCase();
    var items = state.recs.filter(function(r){
      var st = statusOf(r);
      if (ui.filter === 'inbuy' && st.key !== 'inbuy') return false;
      if (ui.filter === 'below' && st.key !== 'below') return false;
      if (ui.filter === 'above' && st.key !== 'above') return false;
      if (ui.filter === 'sell' && st.key !== 'sellHigh' && st.key !== 'sellLow') return false;
      if (ui.filter === 'hold' && !holdOf(r)) return false;
      if (!q) return true;
      return (r.code + r.name + r.broker).toLowerCase().indexOf(q) >= 0;
    });
    if (!items.length){
      list.innerHTML = '<div class="empty"><h3>' + (state.recs.length ? '没有匹配的标的' : '还没有推荐记录') + '</h3><p>'
        + (state.recs.length ? '换个筛选条件或搜索词试试。' : '粘贴券商推荐原文即可自动识别录入。')

      html += '<div class="empty"><h3>提醒箱是空的</h3><p>更新一次收盘价，或等待计划触发，这里就会记录收盘价与推荐区间的比对结果。</p>'

    var todayK = dateKey(new Date());
    var yest = new Date(Date.now() - 86400000);

    order.forEach(function(k){
      var label = k === todayK ? '今天' : (k === yestK ? '昨天' : k);
      html += '<section class="alert-group"><p class="alert-date">' + label + '</p><ul>' + groups[k].map(alertItem).join('') + '</ul></section>';
    });
